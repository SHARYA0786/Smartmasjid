<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masjid Connect - Smart Islamic Mosque & Live Azan Network</title>
    <meta name="theme-color" content="#0c4033">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕌</text></svg>">
    
    <!-- Tailwind CSS & React 18 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: { colors: { masjid: { dark: '#07382c', primary: '#0c4033', light: '#eaf5ed', card: '#f4f9f6', gold: '#eab308' } } } }
      }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase, MQTT & Leaflet Maps -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Fonts & Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      .font-urdu { font-family: 'Noto Nastaliq Urdu', 'Amiri', serif; }
      .font-arabic { font-family: 'Amiri', serif; }
      .font-masjid { font-family: 'Rozha One', 'Amiri', serif; }
      @keyframes wave-bar { 0%, 100% { height: 6px; } 50% { height: 22px; } }
      .wave-bar-1 { animation: wave-bar 0.8s ease-in-out infinite; }
      .wave-bar-2 { animation: wave-bar 0.8s ease-in-out 0.2s infinite; }
      .wave-bar-3 { animation: wave-bar 0.8s ease-in-out 0.4s infinite; }
    </style>
</head>
<body class="bg-[#f0f4f1] text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <!-- 1. अलग-अलग फ़ीचर फ़ाइलें लोड करें (Lazy Modular System) -->
    <script type="text/babel" src="./features/tasbih.js"></script>
    <script type="text/babel" src="./features/qibla.js"></script>
    <script type="text/babel" src="./features/ramzan.js"></script>
    <script type="text/babel" src="./features/namazTracker.js"></script>
    <script type="text/babel" src="./features/registry.js"></script>

    <!-- 2. मुख्य ऐप कोड (core.js में आपका पुराना मुख्य लॉजिक रहेगा) -->
    <script type="text/babel" src="./core.js"></script>
</body>
</html>
