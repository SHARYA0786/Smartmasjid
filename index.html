<body class="bg-[#f0f4f1] text-slate-800 antialiased min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      // GLOBAL REALTIME CLOUD NETWORK (v12 - Clears Old Corrupted Cache)
      const MQTT_PRIMARY_WS = 'wss://broker.emqx.io:8084/mqtt';
      const MQTT_TOPIC_VERSION = 'masjid_connect_v12_stable'; 
      
      const TOPIC_DB_PREFIX = `${MQTT_TOPIC_VERSION}/db/`; 
      const TOPIC_EVENTS = `${MQTT_TOPIC_VERSION}/events`;
      const TOPIC_LIVE_AZAN = `${MQTT_TOPIC_VERSION}/live_broadcast`;
      const TOPIC_AUDIO_PREFIX = `${MQTT_TOPIC_VERSION}/audio/`;

      const LIVE_STALE_MS = 45000; // itne waqt tak heartbeat na aaye to live band maana jayega
      const myClientId = 'mc_u_' + Math.random().toString(36).substring(2, 9);
      let mqttClient = null;

      try {
        if (typeof mqtt !== 'undefined') {
          mqttClient = mqtt.connect(MQTT_PRIMARY_WS, { clientId: myClientId, clean: true, keepalive: 30, reconnectPeriod: 2000 });
        }
      } catch (err) {}

      // SAFE LOCAL STORAGE HELPER
      const safeStorageSet = (key, value) => { try { localStorage.setItem(key, value); } catch(e) {} };
      const safeStorageGet = (key, fallback = null) => { try { return localStorage.getItem(key) || fallback; } catch(e) { return fallback; } };

      // REAL-TIME AUDIO ENGINE
      class LiveAzanStreamer {
        constructor() { this.recordCtx = null; this.playCtx = null; this.micStream = null; this.processor = null; this.isBroadcasting = false; this.nextPlayTime = 0; this.masjidId = null; this.startedAt = 0; this.mediaEl = null; this.mediaDest = null; this.outNode = null; }
        initContext() {
          if (!this.playCtx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext; this.playCtx = new AudioCtx({ sampleRate: 16000 });
            // silent/mute switch ke bawajood awaaz: media-element se play (iPhone ka "playback" audio session)
            try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
            try { this.mediaDest = this.playCtx.createMediaStreamDestination(); this.mediaEl = new Audio(); this.mediaEl.setAttribute('playsinline', ''); this.mediaEl.srcObject = this.mediaDest.stream; } catch (e) { this.mediaEl = null; }
          }
          if (this.playCtx.state === 'suspended') this.playCtx.resume();
          if (this.mediaEl && this.mediaEl.paused) { try { const pr = this.mediaEl.play(); if (pr && pr.then) pr.then(() => { this.outNode = this.mediaDest; }).catch(() => { this.outNode = null; }); } catch (e) {} }
          return this.playCtx;
        }
        getOut(ctx) { return (this.outNode && this.mediaEl && !this.mediaEl.paused) ? this.outNode : ctx.destination; }
        async startBroadcast(masjidId) {
          try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return { success: false, error: 'माइक उपलब्ध नहीं है।' };
            this.micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true, channelCount: 1 }, video: false });
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.recordCtx = new AudioCtx({ sampleRate: 16000 });
            if (this.recordCtx.state === 'suspended') await this.recordCtx.resume();
            const source = this.recordCtx.createMediaStreamSource(this.micStream);
            this.processor = this.recordCtx.createScriptProcessor(2048, 1, 1);
            this.processor.onaudioprocess = (e) => {
              if (!this.isBroadcasting) return;
              const input = e.inputBuffer.getChannelData(0); const pcm16 = new Int16Array(input.length);
              for (let i = 0; i < input.length; i++) { const s = Math.max(-1, Math.min(1, input[i])); pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF; }
              const u8 = new Uint8Array(pcm16.buffer); let binary = ''; for (let i = 0; i < u8.byteLength; i++) binary += String.fromCharCode(u8[i]);
              if (mqttClient && mqttClient.connected) mqttClient.publish(TOPIC_AUDIO_PREFIX + masjidId, btoa(binary), { qos: 0 });
            };
            source.connect(this.processor); this.processor.connect(this.recordCtx.destination); this.masjidId = masjidId; this.startedAt = Date.now(); this.isBroadcasting = true;
            if (mqttClient && mqttClient.connected) mqttClient.publish(TOPIC_LIVE_AZAN, JSON.stringify({ isLive: true, masjidId, startedAt: this.startedAt, ts: Date.now() }), { retain: true, qos: 1 });
            return { success: true };
          } catch (err) { return { success: false, error: 'माइक की अनुमति दें।' }; }
        }
        stopBroadcast(masjidId) {
          this.isBroadcasting = false;
          if (this.processor) { try { this.processor.disconnect(); } catch(e){} this.processor = null; }
          if (this.recordCtx) { try { this.recordCtx.close(); } catch(e){} this.recordCtx = null; }
          if (this.micStream) { this.micStream.getTracks().forEach(t => t.stop()); this.micStream = null; }
          if (mqttClient && mqttClient.connected) mqttClient.publish(TOPIC_LIVE_AZAN, JSON.stringify({ isLive: false, masjidId, stoppedAt: Date.now(), ts: Date.now() }), { retain: true, qos: 1 });
        }
        heartbeat(masjidId) {
          if (this.isBroadcasting && mqttClient && mqttClient.connected) mqttClient.publish(TOPIC_LIVE_AZAN, JSON.stringify({ isLive: true, masjidId, startedAt: this.startedAt, ts: Date.now() }), { retain: true, qos: 1 });
        }
        playLiveVoicePacket(base64Data, volume = 1.0) {
          try {
            const ctx = this.initContext(); const binary = atob(base64Data); const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const int16 = new Int16Array(bytes.buffer); const float32 = new Float32Array(int16.length);
            for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / (int16[i] < 0 ? 0x8000 : 0x7FFF);
            const audioBuf = ctx.createBuffer(1, float32.length, 16000); audioBuf.copyToChannel(float32, 0);
            const source = ctx.createBufferSource(); source.buffer = audioBuf;
            const gainNode = ctx.createGain(); gainNode.gain.value = Math.max(0.3, Math.min(2.5, volume * 1.8));
            source.connect(gainNode); gainNode.connect(this.getOut(ctx));
            const now = ctx.currentTime; if (!this.nextPlayTime || this.nextPlayTime < now) this.nextPlayTime = now + 0.04;
            source.start(this.nextPlayTime); this.nextPlayTime += audioBuf.duration;
          } catch(e) {}
        }
        playMelodicAlarm() {
          try {
            const ctx = this.initContext(); const notes = [293.66, 369.99, 440.00, 369.99, 329.63, 293.66];
            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator(); const gain = ctx.createGain();
              osc.type = 'sine'; osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.35);
              gain.gain.setValueAtTime(0.001, ctx.currentTime + idx * 0.35);
              gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + idx * 0.35 + 0.05);
              gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.35 + 0.45);
              osc.connect(gain); gain.connect(this.getOut(ctx)); osc.start(ctx.currentTime + idx * 0.35); osc.stop(ctx.currentTime + idx * 0.35 + 0.5);
            });
          } catch(e) {}
        }
      }
      const azanStreamer = new LiveAzanStreamer();

      function calculateDistanceKm(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
        const R = 6371; const dLat = ((lat2 - lat1) * Math.PI) / 180; const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      // ----------------------------------------------------
      // HELPERS: photo compress, time format, hijri
      // ----------------------------------------------------
      const compressImageFile = (file, maxDim = 480, quality = 0.72) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const w = Math.max(1, Math.round(img.width * scale)); const h = Math.max(1, Math.round(img.height * scale));
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', quality));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      const DEFAULT_SCHEDULE = { fajr: '05:20', fajrJamat: '05:45', sunrise: '06:40', zuhr: '12:35', zuhrJamat: '13:00', asr: '16:20', asrJamat: '16:45', sunset: '17:45', maghrib: '17:50', maghribJamat: '18:10', isha: '19:15', ishaJamat: '19:45', jumaAzan: '13:00', jumaJamat: '13:30' };
      const PM_KEYS = ['iftar', 'zuhr', 'zuhrJamat', 'asr', 'asrJamat', 'maghrib', 'maghribJamat', 'isha', 'ishaJamat', 'sunset', 'jumaAzan', 'jumaJamat'];
      // purana data "04:20" (12-ghante style) ho sakta hai: dopahar ke baad wali namaz ko 24-ghante me badalta hai
      const normTime = (key, v) => {
        if (!v || typeof v !== 'string') return '';
        const m = v.match(/^(\d{1,2}):(\d{2})/); if (!m) return v;
        let h = parseInt(m[1], 10); if (PM_KEYS.includes(key) && h < 12) h += 12;
        return `${String(h).padStart(2, '0')}:${m[2]}`;
      };
      const normSchedule = (s) => { const out = {}; Object.keys(DEFAULT_SCHEDULE).forEach(k => { out[k] = normTime(k, (s && s[k]) || DEFAULT_SCHEDULE[k]); }); return out; };
      const splitTime12 = (key, v, def) => {
        const n = normTime(key, v || def); const m = n.match(/^(\d{1,2}):(\d{2})/); if (!m) return { t: n, ap: '' };
        let h = parseInt(m[1], 10); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return { t: `${h}:${m[2]}`, ap };
      };
      const t12 = (key, v, def) => { const x = splitTime12(key, v, def); return `${x.t} ${x.ap}`.trim(); };
      const T = (sch, key, def) => { const x = splitTime12(key, sch && sch[key], def); return <>{x.t}<span className="text-[9px] font-bold ml-0.5">{x.ap}</span></>; };

      // ---- NAMAZ PROGRESS BAR HELPER & COMPONENT ----
      const getNamazProgressInfo = (schedule, now = new Date()) => {
        if (!schedule) return null;
        const sch = normSchedule(schedule);
        const parseMin = (str) => {
          if (!str) return 0;
          const m = String(str).match(/^(\d{1,2}):(\d{2})/);
          if (!m) return 0;
          return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
        };

        const prayers = [
          { key: 'fajr', label: 'Fajr', timeStr: sch.fajr || '05:20', min: parseMin(sch.fajr || '05:20') },
          { key: 'zuhr', label: 'Zuhr', timeStr: sch.zuhr || '12:35', min: parseMin(sch.zuhr || '12:35') },
          { key: 'asr', label: 'Asr', timeStr: sch.asr || '16:20', min: parseMin(sch.asr || '16:20') },
          { key: 'maghrib', label: 'Maghrib', timeStr: sch.maghrib || '17:50', min: parseMin(sch.maghrib || '17:50') },
          { key: 'isha', label: 'Isha', timeStr: sch.isha || '19:15', min: parseMin(sch.isha || '19:15') }
        ];

        const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
        let nextKey = 'fajr';
        let startMin = prayers[4].min - 1440;
        let endMin = prayers[0].min;

        if (nowMin < prayers[0].min) {
          nextKey = 'fajr';
          startMin = prayers[4].min - 1440;
          endMin = prayers[0].min;
        } else if (nowMin < prayers[1].min) {
          nextKey = 'zuhr';
          startMin = prayers[0].min;
          endMin = prayers[1].min;
        } else if (nowMin < prayers[2].min) {
          nextKey = 'asr';
          startMin = prayers[1].min;
          endMin = prayers[2].min;
        } else if (nowMin < prayers[3].min) {
          nextKey = 'maghrib';
          startMin = prayers[2].min;
          endMin = prayers[3].min;
        } else if (nowMin < prayers[4].min) {
          nextKey = 'isha';
          startMin = prayers[3].min;
          endMin = prayers[4].min;
        } else {
          nextKey = 'fajr';
          startMin = prayers[4].min;
          endMin = prayers[0].min + 1440;
        }

        const effectiveNow = (nowMin < prayers[0].min) ? nowMin : (nowMin >= prayers[4].min && endMin > 1440 ? nowMin : nowMin);
        const totalSpan = Math.max(1, endMin - startMin);
        const elapsed = Math.max(0, effectiveNow - startMin);
        const progress = Math.min(100, Math.max(0, Math.round((elapsed / totalSpan) * 100)));

        const remainingMin = Math.max(0, Math.round(endMin - effectiveNow));
        const remH = Math.floor(remainingMin / 60);
        const remM = remainingMin % 60;
        const remainStr = remH > 0 ? `${remH}h ${remM}m` : `${remM}m`;

        const nextPrayerObj = prayers.find(p => p.key === nextKey) || prayers[0];
        const nextTime12 = t12(nextKey, nextPrayerObj.timeStr);

        const enrichedPrayers = prayers.map(p => {
          const isPassed = nowMin >= p.min;
          const isNext = p.key === nextKey;
          return {
            ...p,
            time12: t12(p.key, p.timeStr),
            isPassed,
            isNext
          };
        });

        return {
          nextKey,
          nextName: nextPrayerObj.label,
          nextTime12,
          progress,
          remainStr,
          prayers: enrichedPrayers
        };
      };

      const NamazProgressBar = ({ schedule, currentTime, darkMode }) => {
        const info = getNamazProgressInfo(schedule, currentTime);
        if (!info) return null;
        return (
          <div className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} rounded-2xl py-1.5 px-3 border shadow-xs space-y-1.5`}>
            {/* Header: Next Prayer name, time & Countdown */}
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-1.5 min-w-0">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping shrink-0" />
                <span className="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Next:</span>
                <span className="font-extrabold text-xs text-emerald-800 dark:text-emerald-300 truncate">
                  {info.nextName} {info.nextTime12}
                </span>
              </div>
              <div className="flex items-center gap-1 font-mono font-black text-[10.5px] text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/40 px-2 py-0.5 rounded-full border border-amber-200 dark:border-amber-800/40 shrink-0">
                <span>⏳</span>
                <span>{info.remainStr} left</span>
              </div>
            </div>

            {/* Dynamic Progress Line */}
            <div className="w-full h-2 bg-slate-100 dark:bg-slate-700/80 rounded-full overflow-hidden p-[1px] border border-slate-200 dark:border-slate-600">
              <div
                className="h-full rounded-full bg-gradient-to-r from-emerald-600 via-teal-500 to-amber-400 transition-all duration-700 shadow-xs"
                style={{ width: `${info.progress}%` }}
              />
            </div>
          </div>
        );
      };

      // ==========================================================
      // ADMIN (APP BANANE WALE) KI JANKARI - yahin badlein
      // upiId khaali ("") ho to "सर्वर में मदद करें" card nahi dikhega
      // ==========================================================
      const ADMIN_SUPPORT = {
        naam: '',            // jaise: 'Mohd Aslam'
        upiId: '',           // jaise: 'yourname@upi'
        whatsapp: '',        // jaise: '919876543210' (bina + ke)
        email: '',           // jaise: 'you@gmail.com'
        qrPhoto: ''          // optional: apne QR ki photo ka data-URL ya link
      };
      const APP_VERSION = 'v1.0';
      const APP_SHARE_LINK = '';   // yahan apna ऐप ka link (GitHub Pages) likhein - WhatsApp share me judega
      const FACILITIES = ['औरतों का हिस्सा', 'वुज़ूख़ाना', 'पार्किंग', 'व्हीलचेयर', 'क़ब्रिस्तान', 'जनाज़ा सेवा'];
      const upiLink = (upi, name, amt) => `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name || '')}&cu=INR${amt ? '&am=' + amt : ''}`;

      // ---- list ke teen barabar chhote button ----
      const pillBase = 'w-[30px] h-[30px] rounded-lg flex items-center justify-center border active:scale-95 transition';
      const FavButton = ({ isFav, onClick }) => (
        <button onClick={(e) => { e.stopPropagation(); onClick(); }} aria-label={isFav ? 'पसंदीदा से हटाएं' : 'पसंदीदा बनाएं'} className={`${pillBase} ${isFav ? 'bg-amber-400 border-amber-500 text-slate-900' : 'bg-white dark:bg-slate-800 border-amber-300 text-amber-600'}`}>
          <svg className={`w-[18px] h-[18px] stroke-current ${isFav ? 'fill-slate-900' : 'fill-transparent'}`} viewBox="0 0 24 24" strokeWidth="2" strokeLinejoin="round"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" /></svg>
        </button>
      );
      const InfoButton = ({ onClick }) => (
        <button onClick={(e) => { e.stopPropagation(); onClick(); }} aria-label="मस्जिद की जानकारी" className={`${pillBase} bg-emerald-50 dark:bg-emerald-900/30 border-emerald-300 dark:border-emerald-700 text-emerald-800 dark:text-emerald-300`}>
          <svg className="w-[18px] h-[18px]" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8v.5" /></svg>
        </button>
      );
      const RouteButton = ({ m }) => (
        <a href={`https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}`} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()} aria-label="Google Maps से रास्ता" className={`${pillBase} bg-gradient-to-br from-emerald-600 to-[#07382c] border-amber-300/50 text-white`}>
          <svg className="w-[18px] h-[18px] text-amber-300" viewBox="0 0 24 24" fill="currentColor"><path d="M21.71 11.29l-9-9a1 1 0 00-1.42 0l-9 9a1 1 0 000 1.42l9 9a1 1 0 001.42 0l9-9a1 1 0 00-1.42zM14 14.5V12h-4v3H8v-4a1 1 0 011-1h5V7.5l3.5 3.5-3.5 3.5z" /></svg>
        </a>
      );
      const InfoRow = ({ label, value }) => (value ? <div className="flex justify-between gap-3 text-[13px]"><span className="text-slate-500 shrink-0">{label}</span><b className="text-right break-words">{value}</b></div> : null);

      // ---- Ramzan helpers ----
      const hijriParts = (d) => {
        try {
          const ps = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric', month: 'numeric', year: 'numeric' }).formatToParts(d);
          const g = (k) => parseInt(ps.find(x => x.type === k).value, 10);
          return { d: g('day'), m: g('month'), y: g('year') };
        } catch (e) { return null; }
      };
      const getRamadanStart = (now, offsetDays) => {
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
        for (let i = -29; i < 430; i++) {
          const g = new Date(today.getTime() + i * 86400000);
          const hp = hijriParts(new Date(g.getTime() - offsetDays * 86400000));
          if (hp && hp.m === 9 && hp.d === 1) return g;
        }
        return null;
      };

      // ---- Qibla compass ----
      const KAABA = { lat: 21.4225, lng: 39.8262 };
      const qiblaBearing = (lat, lng) => {
        const r = Math.PI / 180; const p1 = lat * r, p2 = KAABA.lat * r, dl = (KAABA.lng - lng) * r;
        const y = Math.sin(dl) * Math.cos(p2); const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
        return (Math.atan2(y, x) / r + 360) % 360;
      };
      const kaabaDistanceKm = (lat, lng) => {
        const r = Math.PI / 180; const dLat = (KAABA.lat - lat) * r, dLng = (KAABA.lng - lng) * r;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat * r) * Math.cos(KAABA.lat * r) * Math.sin(dLng / 2) ** 2;
        return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      };
      const QiblaCompass = ({ lat, lng, hasGps, onGps }) => {
        const [heading, setHeading] = useState(null); const [active, setActive] = useState(false); const [msg, setMsg] = useState('');
        const bearing = hasGps ? qiblaBearing(lat, lng) : null;
        useEffect(() => {
          if (!active) return;
          const handler = (ev) => {
            let h = null;
            if (typeof ev.webkitCompassHeading === 'number') h = ev.webkitCompassHeading;
            else if (ev.absolute && typeof ev.alpha === 'number') h = (360 - ev.alpha) % 360;
            if (h !== null) setHeading(h);
          };
          window.addEventListener('deviceorientationabsolute', handler, true); window.addEventListener('deviceorientation', handler, true);
          return () => { window.removeEventListener('deviceorientationabsolute', handler, true); window.removeEventListener('deviceorientation', handler, true); };
        }, [active]);

            }
            setActive(true); setMsg('');
          } catch (e) { setMsg('इस फोन/ब्राउज़र में कंपास सेंसर उपलब्ध नहीं है।'); }
        };
        const diff = bearing !== null && heading !== null ? ((bearing - heading + 540) % 360) - 180 : null;
        const aligned = diff !== null && Math.abs(diff) < 5;
        const arrowRot = bearing !== null ? (heading !== null ? bearing - heading : bearing) : 0;
        const northRot = heading !== null ? -heading : 0;
        return (
          <div className="flex flex-col items-center gap-3">
            <svg width="260" height="260" viewBox="0 0 260 260" role="img" aria-label="क़िब्ला कंपास">

        const [tasbihStep, setTasbihStep] = useState(1);

          else if (tasbihStep === 3) { if (tasbihCount + 1 >= 34) { setTasbihStep(1); setTasbihCount(0); setTasbihLaps(prev => prev + 1); } else setTasbihCount(prev => prev + 1); }

        // CLOUD SYNC - ye effect sirf EK baar chalta hai; taaza state stateRef se aati hai
        const stateRef = useRef({});

        const alertedSessionsRef = useRef({});

        useEffect(() => {
          if (!mqttClient) return;
          let seenIds = new Set(); let pruneTimer = null; let republishTimer = null;

          const handleConnect = () => {
            setCloudOnline(true);
            seenIds = new Set();
            mqttClient.subscribe([ TOPIC_DB_PREFIX + '+', TOPIC_EVENTS, TOPIC_LIVE_AZAN, TOPIC_AUDIO_PREFIX + '+' ], { qos: 1 });
            clearTimeout(republishTimer); clearTimeout(pruneTimer);
            republishTimer = setTimeout(() => {
              const s = stateRef.current; const mine = s.loggedImamMasjidId && s.masjids[s.loggedImamMasjidId];
              if (mine && mqttClient.connected) mqttClient.publish(`${TOPIC_DB_PREFIX}${mine.id}`, JSON.stringify(mine), { retain: true, qos: 0 });
            }, 2500);
            pruneTimer = setTimeout(() => {
              if (!mqttClient.connected || seenIds.size === 0) return;
              const ownId = stateRef.current.loggedImamMasjidId;
              setMasjids(prev => {
                const u = { ...prev }; let changed = false;
                Object.keys(u).forEach(id => { if (!seenIds.has(id) && id !== ownId) { delete u[id]; changed = true; } });
                if (!changed) return prev; persist(u); return u;
              });
            }, 6000);
          };
          const handleOffline = () => setCloudOnline(false);
          mqttClient.on('connect', handleConnect);
          mqttClient.on('close', handleOffline);
          mqttClient.on('offline', handleOffline);
          if (mqttClient.connected) handleConnect();

          const handleMessage = (topic, message) => {
            const s = stateRef.current; const str = message.toString();
            if (topic.startsWith(TOPIC_DB_PREFIX)) {
              const mId = topic.slice(TOPIC_DB_PREFIX.length);
              if (message.length === 0 || str === '""' || str === '{}') {
                setMasjids(prev => { if (!prev[mId]) return prev; const u = { ...prev }; delete u[mId]; persist(u); return u; });
              } else {
                try {
                  const cloudData = JSON.parse(str);
                  if (cloudData && cloudData.id) {
                    seenIds.add(cloudData.id);
                    const old = s.masjids[cloudData.id];
                    if (old && s.favorites.includes(cloudData.id) && s.loggedImamMasjidId !== cloudData.id && Array.isArray(cloudData.notifications) && cloudData.notifications.length > (old.notifications || []).length && (cloudData.updatedAt || 0) > (old.updatedAt || 0)) {
                      const n = cloudData.notifications[0]; s.showToast(`📢 ${cloudData.name}: ${n.title}`);
                    }
                    setMasjids(prev => {
                      const ex = prev[cloudData.id];

                      const merged = { ...prev, [cloudData.id]: { ...ex, ...cloudData } };
                      persist(merged); return merged;
                    });
                  }
                } catch (e) {}
              }
            }
            if (topic === TOPIC_EVENTS) {
              try {
                const ev = JSON.parse(str);

                  setFavorites(prev => { if (!prev.includes(ev.oldId)) return prev; const n = prev.map(x => (x === ev.oldId ? ev.newId : x)); safeStorageSet('mc_user_favorites', JSON.stringify(n)); return n; });
                  setSelectedMasjidId(prev => { if (prev !== ev.oldId) return prev; safeStorageSet('mc_selected_masjid_id', ev.newId); return ev.newId; });
                  setLoggedImamMasjidId(prev => { if (prev !== ev.oldId) return prev; safeStorageSet('mc_logged_imam_masjid_id', ev.newId); return ev.newId; });
                }
                if (ev.type === 'MASJID_DELETED' && ev.deletedId) {
                  setFavorites(prev => { const nextFavs = prev.filter(x => x !== ev.deletedId); safeStorageSet('mc_user_favorites', JSON.stringify(nextFavs)); return nextFavs; });
                  setSelectedMasjidId(prev => (prev === ev.deletedId ? null : prev));
                  setLoggedImamMasjidId(prev => { if (prev === ev.deletedId) { try { localStorage.removeItem('mc_logged_imam_masjid_id'); } catch (e) {} return null; } return prev; });
                }
                if (ev.type === 'FAVORITE_COUNT_UPDATE' && ev.masjidId) {
                  setMasjids(prev => {
                    const target = prev[ev.masjidId];
                    if (!target) return prev;
                    const cur = target.followersCount ?? target.favoritesCount ?? (s.favorites.includes(ev.masjidId) ? 1 : 0);
                    const nextCount = Math.max(0, cur + (ev.delta || 0));
                    const updated = { ...prev, [ev.masjidId]: { ...target, followersCount: nextCount, updatedAt: Date.now() } };
                    persist(updated);
                    return updated;
                  });
                }
              } catch (e) {}
            }
            if (topic === TOPIC_LIVE_AZAN) {
              try {
                const st = JSON.parse(str); if (!st || !st.masjidId) return;
                if (st.isLive) {
                  const ts = st.ts || st.startedAt || 0;
                  if (Date.now() - ts > LIVE_STALE_MS) return;
                  setLiveBroadcasts(prev => ({ ...prev, [st.masjidId]: Date.now() }));
                  const isSelf = s.isImamLive || (s.loggedImamMasjidId && s.loggedImamMasjidId === st.masjidId);
                  if (!isSelf && s.liveAzanOn && s.favorites.includes(st.masjidId) && alertedSessionsRef.current[st.masjidId] !== st.startedAt) {
                    alertedSessionsRef.current[st.masjidId] = st.startedAt;
                    azanStreamer.initContext(); azanStreamer.playMelodicAlarm();

                    setIncomingAzanAlert({ masjidId: st.masjidId, masjidName: (s.masjids[st.masjidId] && s.masjids[st.masjidId].name) || 'मस्जिद' });
                    setActiveListeningMasjidId(st.masjidId);
                  }
                } else if (st.isLive === false) {
                  setLiveBroadcasts(prev => { if (!prev[st.masjidId]) return prev; const u = { ...prev }; delete u[st.masjidId]; return u; });
                  delete alertedSessionsRef.current[st.masjidId];
                  setActiveListeningMasjidId(p => (p === st.masjidId ? null : p));
                  setIncomingAzanAlert(p => (p && p.masjidId === st.masjidId ? null : p));
                }
              } catch (e) {}
            }
            if (topic.startsWith(TOPIC_AUDIO_PREFIX)) {
              const mId = topic.slice(TOPIC_AUDIO_PREFIX.length);
              const isSelf = s.isImamLive || (s.loggedImamMasjidId && s.loggedImamMasjidId === mId);
              if (!isSelf && s.liveAzanOn && s.activeListeningMasjidId === mId && s.favorites.includes(mId)) azanStreamer.playLiveVoicePacket(str, 1.0);
            }
          };

          mqttClient.on('message', handleMessage);
          return () => {
            clearTimeout(republishTimer); clearTimeout(pruneTimer);
            mqttClient.removeListener('connect', handleConnect); mqttClient.removeListener('close', handleOffline);
            mqttClient.removeListener('offline', handleOffline); mqttClient.removeListener('message', handleMessage);
          };
        }, []);

        // Imam live ho to har 15 sec heartbeat

            setShowChangePasswordModal(false); setNewPassword(''); setConfirmPassword(''); showToast('✅ पासवर्ड बदल दिया गया है!');
        };

        const openEditTimeModal = (targetMasjid = null) => {
          const m = targetMasjid || loggedImamMasjid || masjids[loggedImamMasjidId]; if (!m) return;

          setEditEnglishDate(m.englishDateStr || currentTime.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit', year: 'numeric' }));

        const handleSaveHadithInstant = (e) => {
          e.preventDefault(); if (!loggedImamMasjidId || !editHadithText.trim()) return; const target = masjids[loggedImamMasjidId]; if (!target) return;
          publishMasjidUpdate({ ...target, dailyHadith: editHadithText.trim(), dailyHadithRef: editHadithRef.trim(), updatedAt: Date.now() });
          setShowEditHadithModal(false); showToast('आज की हदीस अपडेट हो गई!');
        };

        const handlePostNotice = (e) => {
          e.preventDefault(); if (!loggedImamMasjidId || !newNoticeTitle.trim() || !newNoticeMessage.trim()) return; const target = masjids[loggedImamMasjidId]; if (!target) return;
          const newNotice = { id: 'n_' + Date.now(), title: newNoticeTitle.trim(), message: newNoticeMessage.trim(), date: 'आज ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), category: 'general' };
          publishMasjidUpdate({ ...target, notifications: [newNotice, ...(target.notifications || [])].slice(0, 20), updatedAt: Date.now() });
          setNewNoticeTitle(''); setNewNoticeMessage(''); setShowNewNoticeModal(false); showToast('ऐलान भेज दिया गया!');
        };

        const handleImamLogout = () => {
          if (isImamLive && loggedImamMasjidId) { azanStreamer.stopBroadcast(loggedImamMasjidId); setIsImamLive(false); setLiveBroadcasts(prev => { const u = { ...prev }; delete u[loggedImamMasjidId]; return u; }); }
          setLoggedImamMasjidId(null); localStorage.removeItem('mc_logged_imam_masjid_id');
          setShowEditProfileModal(false); setShowChangePasswordModal(false); setShowEditTimeModal(false); setShowEditHadithModal(false); setShowNewNoticeModal(false); setShowDeleteSafetyModal(false);
          setCurrentTab('profile'); showToast('✅ लॉगआउट हो गया');
        };

        const shareMasjidWhatsApp = (m) => {
          if (!m) return;
          const s = m.schedule || defaultSchedule; const f = (k) => t12(k, s[k], DEFAULT_SCHEDULE[k]);
          const place = [m.address, m.stateLocation, m.stateName].filter(Boolean).join(', ');
          const parts = [
            `🕌 ${m.name}`, `📍 ${place}`, '',
            '🕒 नमाज़ के औक़ात:',
            `Fajr: ${f('fajr')} (जमात ${f('fajrJamat')})`, `Zuhr: ${f('zuhr')} (जमात ${f('zuhrJamat')})`, `Asr: ${f('asr')} (जमात ${f('asrJamat')})`,
            `Maghrib: ${f('maghrib')} (जमात ${f('maghribJamat')})`, `Isha: ${f('isha')} (जमात ${f('ishaJamat')})`, `Juma: ${f('jumaAzan')} (जमात ${f('jumaJamat')})`,
            m.dailyHadith ? `\n📖 आज की हदीस:\n${m.dailyHadith}${m.dailyHadithRef ? ' ' + m.dailyHadithRef : ''}` : null,
            APP_SHARE_LINK ? `\n📲 ऐप का लिंक: ${APP_SHARE_LINK}` : null
          ];
          window.open('https://wa.me/?text=' + encodeURIComponent(parts.filter(x => x !== null).join('\n')), '_blank');
        };

        const handleDirectLoginFromRecovery = (mId) => {
          const target = masjids[mId]; if (!target) return;
          setLoggedImamMasjidId(target.id); setSelectedMasjidId(target.id); setFavorites([target.id]);
          safeStorageSet('mc_logged_imam_masjid_id', target.id); safeStorageSet('mc_selected_masjid_id', target.id); safeStorageSet('mc_user_favorites', JSON.stringify([target.id]));
          setShowForgotCredentialsModal(false); setCurrentTab('profile'); showToast(`✅ लॉगिन सफल!`);

                  {/* Center Title (3-line layout) */}
                  <div className="flex-1 min-w-0 pr-1">

                        </svg>

                      {unreadNotificationCount > 0 && <span className="absolute -top-1 -right-1 min-w-[14px] h-[14px] rounded-full bg-rose-600 text-[8.5px] font-black flex items-center justify-center animate-pulse px-0.5 border border-[#07382c]">{unreadNotificationCount}</span>}

                  <div className="flex items-center gap-3"><div className="w-10 h-10 rounded-full bg-emerald-900 border-2 border-amber-400 flex justify-center items-center text-xl">🕌</div><div><h1 className="text-sm font-black uppercase">मस्जिद कनेक्ट</h1><p className="text-[10px] text-amber-200">स्मार्ट लाइव नेटवर्क</p></div></div>
                  <button onClick={toggleDarkMode} className="w-7 h-7 rounded-full bg-white/10 text-sm">{darkMode ? '☀️' : '🎨'}</button>
                </div>

              <div className="mx-3 mt-1.5 z-20 bg-rose-600 text-white rounded-xl p-2 px-3 shadow-lg flex justify-between items-center border border-rose-300">

                {!isImamLive && liveAzanOn && <button onClick={() => { azanStreamer.initContext(); if (activeListeningMasjidId === currentMasjid.id) setActiveListeningMasjidId(null); else { setActiveListeningMasjidId(currentMasjid.id); azanStreamer.playMelodicAlarm(); } }} className={`px-2.5 py-1 rounded-lg font-black text-[11px] shadow transition ${activeListeningMasjidId === currentMasjid.id ? 'bg-white text-emerald-800' : 'bg-white text-rose-700 animate-pulse'}`}>{activeListeningMasjidId === currentMasjid.id ? '🔊 चालू है' : '🔊 सुनें'}</button>}

                <button onClick={() => { setSelectedMasjidId(incomingAzanAlert.masjidId); setActiveListeningMasjidId(incomingAzanAlert.masjidId); setCurrentTab('home'); }} className="px-2.5 py-1 rounded-lg font-black text-[11px] bg-white text-rose-700 shadow">सुनें</button>
              </div>

            {/* TAB 1: HOME */}
            {currentTab === 'home' && (

                {!currentMasjid ? (
                  landingRoleChoice !== 'muqtadi' ? (
                    <div className="py-2 space-y-3.5">
                      <div className="text-center px-1"><span className="text-[11px] font-bold text-emerald-700 dark:text-emerald-400 uppercase">अस्सलाम अलैकुम</span><h2 className="text-base sm:text-lg font-black mt-0.5">आप क्या हैं?</h2></div>
                      <div className="grid grid-cols-2 gap-3">

                          <span className="text-3xl">👳</span><div><span className="font-black text-xs block">1. क्या आप इमाम हैं?</span></div><span className="w-full py-1.5 bg-[#07382c] text-white rounded-xl font-bold text-[11px]">➕ रजिस्टर करें</span>
                        </button>
                        <button onClick={handleSelectMuqtadiRole} className="p-3.5 rounded-3xl border-2 text-center flex flex-col items-center justify-between gap-2 shadow-md min-h-[145px] bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-700">

                        </button>
                      </div>
                      <div className="text-center pt-0.5"><button onClick={() => setCurrentTab('profile')} className="text-xs text-emerald-800 dark:text-emerald-400 font-bold hover:underline py-1 px-3 rounded-full bg-emerald-50 dark:bg-slate-800 border border-emerald-200 dark:border-slate-700">🔑 इमाम लॉगिन करें</button></div>
                    </div>
                  ) : (
                    <div className="py-2 space-y-3 animate-in fade-in duration-300">
                      <div className={`p-3.5 rounded-3xl border shadow-sm ${darkMode ? 'bg-slate-800/90 border-slate-700' : 'bg-white border-slate-200'}`}>
                        <div className="flex justify-between items-center pb-2 mb-2 border-b dark:border-slate-700"><span className="text-xs font-black">📍 10 KM के दायरे की मस्जिदें</span><span className="text-[10px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-full">{masjidsWithin10Km.length} उपलब्ध</span></div>
                        {masjidsWithin10Km.length === 0 ? (
                          <div className="py-4 text-center"><p className="text-xs font-bold text-slate-600 dark:text-slate-300 mb-2">अभी कोई मस्जिद नहीं मिली</p><button onClick={() => handleFetchGpsLocation(false)} className="text-[11px] font-bold text-emerald-700">🔄 GPS रिफ्रेश करें</button></div>
                        ) : (
                          <div className="space-y-2">
                            {masjidsWithin10Km.map((m) => (
                              <div key={m.id} onClick={() => toggleFavorite(m.id)} className={`p-2.5 rounded-2xl border cursor-pointer flex items-center gap-2.5 ${darkMode ? 'bg-slate-700/60 border-slate-600' : 'bg-[#eaf5ed] border-emerald-200'}`}>
                                <img src={m.photo || 'https://images.unsplash.com/photo-1542816417-0983c9c9ad53?auto=format&fit=crop&w=800&q=80'} alt={m.name} className="w-[96px] h-[96px] rounded-full object-cover border-2 border-emerald-600/40 shrink-0" />
                                <div className="flex-1 min-w-0">

                                <div className="flex flex-col gap-[3px] shrink-0" onClick={(e) => e.stopPropagation()}>

                                  <RouteButton m={m} />

                              </div>
                            ))}
                          </div>

                      </div>
                      <div className="text-center pt-1"><button onClick={() => setCurrentTab('profile')} className="text-[11px] text-slate-500 hover:text-emerald-700">👳 क्या आप इमाम हैं? प्रोफाइल टैब में लॉगिन करें →</button></div>
                    </div>
                  )
                ) : (
                  <>
                    {/* COMBINED DATE & SEHRI / IFTAR CARD */}
                    {(() => {
                      const rz = currentMasjid.ramzan || {};
                      const sch0 = normSchedule(currentMasjid.schedule);
                      return (
                        <div className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} rounded-2xl py-1.5 px-3 border shadow-xs`}>

                            {/* Left Column: English Date + Sehri */}
                            <div className="pr-2 space-y-1">
                              <div className="flex items-center gap-1.5">
                                <span className="text-xs">📅</span>
                                <div className="min-w-0">
                                  <span className="text-[9.5px] text-slate-500 dark:text-slate-400 font-medium block leading-none">English Date</span>
                                  <strong className="text-[11.5px] font-bold block leading-tight mt-0.5 truncate text-slate-900 dark:text-slate-100">
                                    {currentTime.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit', year: 'numeric' })}
                                  </strong>

                            </div>

                              <div className="flex items-center gap-1.5">
                                <span className="text-xs">🕌</span>
                                <div className="min-w-0">
                                  <span className="text-[9.5px] text-slate-500 dark:text-slate-400 font-medium block leading-none">Hijri Date</span>
                                  <strong className="text-[11.5px] font-bold font-urdu block leading-tight mt-0.5 truncate text-emerald-800 dark:text-emerald-400">

                                  </strong>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })()}

                    {/* NAMAZ PROGRESS BAR */}
                    <NamazProgressBar schedule={currentMasjid.schedule} currentTime={currentTime} darkMode={darkMode} />

                    {/* NAMAZ KE AWAQAT */}

                         <h3 className="font-bold text-xs tracking-wide">Namaz Ke Awaqat</h3>

                        <div className="bg-[#fff6be] text-slate-900 rounded-xl p-1 flex flex-col items-center"><span className="text-[11px] font-bold text-slate-800">Zuhr</span><div className="my-0.5 text-amber-600 text-base">☀️</div><span className="text-[8.5px] text-slate-600 font-semibold leading-none">Azan</span><strong className="text-[11px] font-mono font-bold my-0.5 leading-tight">{T(currentMasjid.schedule, 'zuhr', '12:35')}</strong><span className="text-[8.5px] text-slate-600 font-semibold mt-0.5 leading-none">Jamat</span><strong className="text-[11px] font-mono font-black text-amber-950 leading-tight">{T(currentMasjid.schedule, 'zuhrJamat', '01:00')}</strong></div>
                        <div className="bg-[#fedfc7] text-slate-900 rounded-xl p-1 flex flex-col items-center"><span className="text-[11px] font-bold text-slate-800">Asr</span><div className="my-0.5 text-orange-600 text-base">🌤️</div><span className="text-[8.5px] text-slate-600 font-semibold leading-none">Azan</span><strong className="text-[11px] font-mono font-bold my-0.5 leading-tight">{T(currentMasjid.schedule, 'asr', '04:20')}</strong><span className="text-[8.5px] text-slate-600 font-semibold mt-0.5 leading-none">Jamat</span><strong className="text-[11px] font-mono font-black text-orange-950 leading-tight">{T(currentMasjid.schedule, 'asrJamat', '04:45')}</strong></div>
                        <div className="bg-[#ffd7dc] text-slate-900 rounded-xl p-1 flex flex-col items-center"><span className="text-[11px] font-bold text-slate-800">Maghrib</span><div className="my-0.5 text-rose-600 text-base">🌇</div><span className="text-[8.5px] text-slate-600 font-semibold leading-none">Azan</span><strong className="text-[11px] font-mono font-bold my-0.5 leading-tight">{T(currentMasjid.schedule, 'maghrib', '05:50')}</strong><span className="text-[8.5px] text-slate-600 font-semibold mt-0.5 leading-none">Jamat</span><strong className="text-[11px] font-mono font-black text-rose-950 leading-tight">{T(currentMasjid.schedule, 'maghribJamat', '06:10')}</strong></div>
                        <div className="bg-[#d2edfd] text-slate-900 rounded-xl p-1 flex flex-col items-center"><span className="text-[11px] font-bold text-slate-800">Isha</span><div className="my-0.5 text-sky-700 text-base">🌙</div><span className="text-[8.5px] text-slate-600 font-semibold leading-none">Azan</span><strong className="text-[11px] font-mono font-bold my-0.5 leading-tight">{T(currentMasjid.schedule, 'isha', '07:15')}</strong><span className="text-[8.5px] text-slate-600 font-semibold mt-0.5 leading-none">Jamat</span><strong className="text-[11px] font-mono font-black text-sky-950 leading-tight">{T(currentMasjid.schedule, 'ishaJamat', '07:45')}</strong></div>
                      </div>
                      
                      <div className="grid grid-cols-3 gap-1 mt-2 text-center">
                         <div className="bg-[#fff3c4] text-slate-900 rounded-xl p-1.5 flex flex-col items-center shadow-xs"><span className="text-[10px] font-bold text-amber-950 leading-tight">Sunrise (तुलू)</span><div className="text-amber-500 text-base my-0.5">🌄</div><strong className="text-[11px] font-mono font-bold">{T(currentMasjid.schedule, 'sunrise', '06:40')}</strong></div>
                         <div className="bg-[#ffe4cc] text-slate-900 rounded-xl p-1.5 flex flex-col items-center shadow-xs"><span className="text-[10px] font-bold text-orange-950 leading-tight">Sunset (ग़ुरूब)</span><div className="text-orange-500 text-base my-0.5">🌇</div><strong className="text-[11px] font-mono font-bold">{T(currentMasjid.schedule, 'sunset', '05:45')}</strong></div>
                         <div className="bg-[#bbf7d0] text-slate-900 rounded-xl p-1 flex flex-col items-center border border-emerald-300 shadow-xs"><span className="text-[10px] font-bold text-emerald-950 leading-tight">Juma (जुमा)</span><div className="text-emerald-700 text-base my-0.5">🕌</div><div className="flex justify-between w-full px-0.5"><div className="text-center"><span className="text-[8px] text-slate-600 block leading-none">Azan</span><strong className="text-[10.5px] font-mono font-bold">{T(currentMasjid.schedule, 'jumaAzan', '01:00')}</strong></div><div className="text-center"><span className="text-[8px] text-slate-600 block leading-none">Jamat</span><strong className="text-[10.5px] font-mono font-black text-emerald-950">{T(currentMasjid.schedule, 'jumaJamat', '01:30')}</strong></div></div></div>
                      </div>

                      {/* WHATSAPP SHARE BUTTON: In Namaz card on Muqtadi Home page */}
                      <button
                        type="button"
                        onClick={() => shareMasjidWhatsApp(currentMasjid)}
                        className="w-full mt-2 py-2 bg-[#25D366] hover:bg-[#20ba59] active:scale-95 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition"
                      >
                        <span className="text-sm">📲</span>
                        <span>नमाज़ के औक़ात WhatsApp पर शेयर करें</span>
                      </button>
                    </div>

                    <div className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-[#eaf5ed] border-emerald-100'} rounded-2xl p-3 border mt-3`}><h4 className="font-extrabold text-[#07382c] dark:text-emerald-400 text-xs mb-1">Aaj ki Hadees</h4><div className="flex items-start gap-2.5"><div className="w-7 h-7 rounded-lg bg-emerald-700 text-white flex justify-center items-center">📖</div><div className="flex-1"><p className="text-xs leading-relaxed font-medium">{currentMasjid.dailyHadith || '“Ilm hasil karna har Musalman mard aur aurat par farz hai.”'}</p><span className="text-[10px] text-slate-500 block mt-0.5">{currentMasjid.dailyHadithRef || '— (Ibn Majah)'}</span></div></div></div>
                    {(currentMasjid.notifications || []).length > 0 && (
                      <div className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} rounded-2xl p-3 border mt-3`}>
                        <h4 className="font-extrabold text-[#07382c] dark:text-emerald-400 text-xs mb-1.5">📢 ताज़ा ऐलान</h4>
                        <div className="space-y-1.5 max-h-64 overflow-y-auto pr-0.5">
                          {currentMasjid.notifications.map(n => (
                            <div key={n.id} className={`p-2 rounded-xl border ${darkMode ? 'bg-slate-700/60 border-slate-600' : 'bg-amber-50 border-amber-200'}`}>
                              <strong className="text-xs block">{n.title}</strong>
                              <p className="text-[11px] leading-relaxed mt-0.5 font-urdu">{n.message}</p>
                              <span className="text-[9px] text-slate-500">{n.date}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </>
                )}
              </main>
            )}

            {/* TAB 2: NEARBY */}
            {currentTab === 'nearby' && (
              <main className="px-3.5 py-3 space-y-3 flex-1 z-0">
                <div className="flex justify-between"><h3 className="font-extrabold text-sm">📍 10 KM के दायरे की मस्जिदें</h3><span className="text-[11px] font-mono font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">{masjidsWithin10Km.length} उपलब्ध</span></div>
                {masjidsWithin10Km.length === 0 ? ( <div className="py-8 text-center"><p className="text-xs font-bold text-slate-500">अभी कोई मस्जिद 10 KM में नहीं है।</p><button onClick={() => handleFetchGpsLocation(false)} className="mt-2 text-[11px] font-bold text-emerald-700">🔄 GPS रिफ्रेश करें</button></div>
                ) : (
                  <div className="space-y-2.5">
                    {masjidsWithin10Km.map((m) => (
                      <div key={m.id} onClick={() => { setSelectedMasjidId(m.id); safeStorageSet('mc_selected_masjid_id', m.id); setCurrentTab('home'); }} className={`p-2.5 rounded-2xl border cursor-pointer flex items-center gap-2.5 ${currentMasjid && currentMasjid.id === m.id ? 'border-emerald-600 bg-emerald-50/50 dark:bg-slate-800' : darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200/80'}`}>
                        <img src={m.photo || 'https://images.unsplash.com/photo-1542816417-0983c9c9ad53?auto=format&fit=crop&w=800&q=80'} alt={m.name} className="w-[96px] h-[96px] rounded-full object-cover border-2 border-emerald-600/40 shrink-0" />
                        <div className="flex-1 min-w-0">
                          <h4 className="font-black text-[15px] leading-tight break-words">{m.name}</h4>
                          <p className="text-[11px] text-slate-500 leading-snug break-words mt-0.5">{m.address}</p>
                          <span className="inline-block mt-1 text-[10px] font-mono font-bold text-emerald-800 bg-emerald-100 px-1.5 rounded">📍 {m.distanceText}</span>
                        </div>
                        <div className="flex flex-col gap-[3px] shrink-0" onClick={(e) => e.stopPropagation()}>
                          <FavButton isFav={m.isFav} onClick={() => toggleFavorite(m.id)} />
                          <InfoButton onClick={() => openMasjidInfo(m.id, 'nearby')} />
                          <RouteButton m={m} />
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </main>
            )}

            {/* TAB 3: TASBIH */}
            {currentTab === 'tasbih' && (
              <main className="px-4 py-4 space-y-4 flex-1 text-center z-0 pb-24">
                <button onClick={() => setCurrentTab('more')} className="flex items-center gap-1 text-xs font-bold text-emerald-700 min-h-[40px]">← More</button>
                <div className="flex justify-between"><h3 className="font-black text-sm">📿 तस्बीह</h3><button onClick={() => { setTasbihStep(1); setTasbihCount(0); }} className="text-xs text-rose-600 font-bold px-2 py-1 bg-rose-50 rounded-lg">रीसेट</button></div>
                <div className="font-arabic text-3xl text-emerald-800 dark:text-emerald-400 py-4">{tasbihStep === 1 ? 'سُبْحَانَ اللَّهِ' : tasbihStep === 2 ? 'الْحَمْدُ لِلَّهِ' : 'اللَّهُ أَكْبَرُ'}</div>
                <button onClick={handleTasbihTap} className="w-36 h-36 mx-auto rounded-full bg-gradient-to-br from-[#0c4033] to-[#07382c] text-white flex flex-col justify-center shadow-2xl border-4 border-emerald-300"><span className="text-4xl font-black">{tasbihCount}</span></button>
              </main>
            )}

            {/* TAB 4: PROFILE */}
            {currentTab === 'profile' && (
              <main className="px-3.5 py-3 space-y-4 flex-1 z-0 pb-24">
                {loggedImamMasjid ? (
                  <div className="space-y-3 flex flex-col min-h-[calc(100vh-200px)]">
                    {/* LIVE FOLLOWERS CARD FOR IMAM */}
                    <div className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-gradient-to-r from-[#0c4033] to-[#07382c] border-emerald-800 text-white'} p-3.5 px-4 rounded-3xl shadow-sm border flex items-center justify-between`}>
                      <div className="flex items-center gap-3 min-w-0">
                        <div className="w-10 h-10 rounded-2xl bg-amber-400/20 border border-amber-300/40 flex items-center justify-center text-xl shrink-0 shadow-inner">
                          ⭐
                        </div>
                        <div className="min-w-0">
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="text-xs font-black tracking-wide text-amber-300">Live Followers</span>
                            <span className="inline-flex items-center gap-1 bg-emerald-500/30 text-emerald-300 text-[9px] px-1.5 py-0.5 rounded-full font-black border border-emerald-400/30">
                              <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                              LIVE
                            </span>
                          </div>
                          <p className="text-[11px] text-white/90 truncate mt-0.5">
                            {(loggedImamMasjid.followersCount ?? loggedImamMasjid.favoritesCount ?? (favorites.includes(loggedImamMasjid.id) ? 1 : 0))} Muqtadi Starred this Masjid
                          </p>
                        </div>
                      </div>
                      <div className="text-right shrink-0 pl-2">
                        <span className="text-2xl font-mono font-black text-amber-300 block leading-none">
                          {(loggedImamMasjid.followersCount ?? loggedImamMasjid.favoritesCount ?? (favorites.includes(loggedImamMasjid.id) ? 1 : 0))}
                        </span>
                        <span className="text-[9px] font-bold text-emerald-200 block mt-1 uppercase tracking-wider">Muqtadi</span>
                      </div>
                    </div>

                    {/* WHITE CONTAINER: 2-COLUMN GRID OF 8 COMPACT MOBILE ACTION BUTTONS (NO ICONS) */}
                    <div className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} p-4 sm:p-5 rounded-3xl shadow-sm border`}>
                      <div className="grid grid-cols-2 gap-3">
                        {/* Row 1: Namaz Time, Hadith */}
                        <button
                          type="button"
                          onClick={() => openEditTimeModal(loggedImamMasjid)}
                          className="py-3 px-2 rounded-2xl bg-[#eaf5ed] hover:bg-[#d8eedf] active:bg-[#cbe6d4] dark:bg-emerald-950/40 dark:hover:bg-emerald-900/50 border border-emerald-200 dark:border-emerald-800/70 flex items-center justify-center text-center text-[#07382c] dark:text-emerald-200 font-bold text-[13px] sm:text-[14px] shadow-xs active:scale-95 transition min-h-[44px]"
                        >
                          <span>Namaz Time</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => { setEditHadithText(loggedImamMasjid.dailyHadith || ''); setEditHadithRef(loggedImamMasjid.dailyHadithRef || ''); setShowEditHadithModal(true); }}
                          className="py-3 px-2 rounded-2xl bg-[#eaf5ed] hover:bg-[#d8eedf] active:bg-[#cbe6d4] dark:bg-emerald-950/40 dark:hover:bg-emerald-900/50 border border-emerald-200 dark:border-emerald-800/70 flex items-center justify-center text-center text-[#07382c] dark:text-emerald-200 font-bold text-[13px] sm:text-[14px] shadow-xs active:scale-95 transition min-h-[44px]"
                        >
                          <span>Hadith</span>
                        </button>

                        {/* Row 2: Sehri / Iftar, Notice */}
                        <button
                          type="button"
                          onClick={openRamzanEdit}
                          className="py-3 px-2 rounded-2xl bg-[#eaf5ed] hover:bg-[#d8eedf] active:bg-[#cbe6d4] dark:bg-emerald-950/40 dark:hover:bg-emerald-900/50 border border-emerald-200 dark:border-emerald-800/70 flex items-center justify-center text-center text-[#07382c] dark:text-emerald-200 font-bold text-[13px] sm:text-[14px] shadow-xs active:scale-95 transition min-h-[44px]"
                        >
                          <span>Sehri / Iftar</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => setShowNewNoticeModal(true)}
                          className="py-3 px-2 rounded-2xl bg-[#eaf5ed] hover:bg-[#d8eedf] active:bg-[#cbe6d4] dark:bg-emerald-950/40 dark:hover:bg-emerald-900/50 border border-emerald-200 dark:border-emerald-800/70 flex items-center justify-center text-center text-[#07382c] dark:text-emerald-200 font-bold text-[13px] sm:text-[14px] shadow-xs active:scale-95 transition min-h-[44px]"
                        >
                          <span>Notice</span>
                        </button>

                        {/* Row 3: About Masjid, Edit Profile */}
                        <button
                          type="button"
                          onClick={openInfoEdit}
                          className="py-3 px-2 rounded-2xl bg-[#eaf5ed] hover:bg-[#d8eedf] active:bg-[#cbe6d4] dark:bg-emerald-950/40 dark:hover:bg-emerald-900/50 border border-emerald-200 dark:border-emerald-800/70 flex items-center justify-center text-center text-[#07382c] dark:text-emerald-200 font-bold text-[13px] sm:text-[14px] shadow-xs active:scale-95 transition min-h-[44px]"
                        >
                          <span>About Masjid</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => { setEditPhotoUrl(loggedImamMasjid.photo); setEditLat(parseFloat(loggedImamMasjid.lat) || 28.6139); setEditLng(parseFloat(loggedImamMasjid.lng) || 77.2090); setShowEditProfileModal(true); }}
                          className="py-3 px-2 rounded-2xl bg-[#eaf5ed] hover:bg-[#d8eedf] active:bg-[#cbe6d4] dark:bg-emerald-950/40 dark:hover:bg-emerald-900/50 border border-emerald-200 dark:border-emerald-800/70 flex items-center justify-center text-center text-[#07382c] dark:text-emerald-200 font-bold text-[13px] sm:text-[14px] shadow-xs active:scale-95 transition min-h-[44px]"
                        >
                          <span>Edit Profile</span>
                        </button>

                        {/* Row 4: Logout, Delete Profile */}
                        <button
                          type="button"
                          onClick={handleImamLogout}
                          className="py-3 px-2 rounded-2xl bg-[#eaf5ed] hover:bg-[#d8eedf] active:bg-[#cbe6d4] dark:bg-emerald-950/40 dark:hover:bg-emerald-900/50 border border-emerald-200 dark:border-emerald-800/70 flex items-center justify-center text-center text-[#07382c] dark:text-emerald-200 font-bold text-[13px] sm:text-[14px] shadow-xs active:scale-95 transition min-h-[44px]"
                        >
                          <span>Logout</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => { setDeletePasswordInput(''); setShowDeleteSafetyModal(true); }}
                          className="py-3 px-2 rounded-2xl bg-[#eaf5ed] hover:bg-rose-50 active:bg-rose-100 dark:bg-emerald-950/40 dark:hover:bg-rose-950/40 border border-emerald-200 dark:border-emerald-800/70 hover:border-rose-300 dark:hover:border-rose-800 flex items-center justify-center text-center text-[#07382c] dark:text-emerald-200 hover:text-rose-700 dark:hover:text-rose-400 font-bold text-[13px] sm:text-[14px] shadow-xs active:scale-95 transition min-h-[44px]"
                        >
                          <span>Delete Profile</span>
                        </button>
                      </div>
                    </div>

                    {/* LARGE GLOWING CIRCULAR LIVE AZAN BUTTON */}
                    <div className="flex flex-col items-center justify-center py-6 relative">
                      <button
                        type="button"
                        onClick={() => {
                          if (isImamLive) {
                            handleStopLiveAzan(loggedImamMasjid.id);
                          } else {
                            handleStartLiveAzan(loggedImamMasjid.id);
                          }
                        }}
                        className={`w-36 h-36 rounded-full flex flex-col items-center justify-center text-white font-extrabold shadow-2xl active:scale-95 transition-all duration-300 relative cursor-pointer ${
                          isImamLive
                            ? 'bg-rose-700 ring-8 ring-rose-400/50 shadow-rose-600/60 animate-pulse'
                            : 'bg-[#d61818] ring-8 ring-rose-200/70 dark:ring-rose-900/40 shadow-rose-500/40 hover:bg-[#b91212]'
                        }`}
                      >
                        <div className="text-2xl font-black mb-1 tracking-widest flex items-center gap-1">
                          <span className="text-xl">((</span>
                          <span className="w-3 h-3 rounded-full bg-white inline-block"></span>
                          <span className="text-xl">))</span>
                        </div>
                        <span className="text-xs font-black tracking-wide leading-tight text-center px-2">
                          {isImamLive ? 'Stop Live Azan' : 'Start Live Azan'}
                        </span>
                      </button>
                    </div>

                    {/* SUBTLE MOSQUE SILHOUETTE GRAPHIC AT BOTTOM */}
                    <div className="mt-auto pt-4 pointer-events-none select-none opacity-80 dark:opacity-40">
                      <svg viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-auto text-emerald-700/25 dark:text-emerald-500/25">
                        <path d="M200 20 C185 45 170 55 170 80 L230 80 C230 55 215 45 200 20 Z" fill="currentColor" opacity="0.6"/>
                        <rect x="198" y="5" width="4" height="15" fill="currentColor" opacity="0.7"/>
                        <circle cx="200" cy="5" r="3" fill="#eab308" opacity="0.9"/>
                        <path d="M130 40 C120 58 110 65 110 80 L150 80 C150 65 140 58 130 40 Z" fill="currentColor" opacity="0.4"/>
                        <path d="M270 40 C260 58 250 65 250 80 L290 80 C290 65 280 58 270 40 Z" fill="currentColor" opacity="0.4"/>
                        <rect x="80" y="25" width="12" height="55" rx="3" fill="currentColor" opacity="0.5"/>
                        <polygon points="86,10 80,25 92,25" fill="currentColor" opacity="0.6"/>
                        <circle cx="86" cy="9" r="2.5" fill="#eab308" opacity="0.8"/>
                        <rect x="308" y="25" width="12" height="55" rx="3" fill="currentColor" opacity="0.5"/>
                        <polygon points="314,10 308,25 320,25" fill="currentColor" opacity="0.6"/>
                        <circle cx="314" cy="9" r="2.5" fill="#eab308" opacity="0.8"/>
                        <path d="M0 80 Q100 70 200 80 T400 80 L400 120 L0 120 Z" fill="currentColor" opacity="0.3"/>
                        <path d="M0 95 Q200 75 400 95 L400 120 L0 120 Z" fill="#07382c" opacity="0.5"/>
                        <path d="M0 105 Q200 90 400 105 L400 120 L0 120 Z" fill="#eab308" opacity="0.4"/>
                      </svg>
                    </div>
                  </div>
                ) : (
                  <div className={`${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} p-5 rounded-3xl shadow-sm border space-y-4`}>
                    <div className="text-center pb-1"><div className="w-14 h-14 rounded-full bg-emerald-50 dark:bg-slate-700 text-emerald-800 dark:text-emerald-300 text-3xl mx-auto flex justify-center items-center">👳</div><h3 className="font-black text-sm mt-2">Imam Login</h3></div>
                    <form onSubmit={(e) => { e.preventDefault(); handleExecuteImamLogin(loginMasjidId, loginPasscode); }} className="space-y-3 text-xs">
                      <div><input type="text" value={loginMasjidId} onChange={(e) => { setLoginMasjidId(e.target.value); setLoginError(false); }} placeholder="Mosque ID (e.g. MASJID-101) *" required className="w-full p-2.5 border rounded-2xl uppercase font-bold dark:bg-slate-700 dark:border-slate-600" /></div>
                      <div><input type="password" value={loginPasscode} onChange={(e) => { setLoginPasscode(e.target.value); setLoginError(false); }} placeholder="Password (e.g. 786) *" required className="w-full p-2.5 border rounded-2xl font-bold dark:bg-slate-700 dark:border-slate-600" /></div>
                      {loginError && <div className="p-2 bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800 rounded-xl text-rose-700 dark:text-rose-400 font-bold"><p>⚠️ Invalid Mosque ID or Password!</p><button type="button" onClick={() => setShowForgotCredentialsModal(true)} className="underline text-[11px] mt-1">👉 Find ID or Reset Password</button></div>}
                      <button type="submit" className="w-full py-3 bg-[#07382c] text-white font-extrabold rounded-2xl text-xs">🔐 Login</button>
                      <div className="text-center pt-1"><button type="button" onClick={() => setShowForgotCredentialsModal(true)} className="text-emerald-700 dark:text-emerald-400 font-extrabold text-[11px] underline">🔑 Forgot Mosque ID or Password?</button></div>
                    </form>
                    <div className="pt-2 border-t dark:border-slate-700 text-center space-y-2"><p className="text-[11px] text-slate-500">Is your mosque not registered yet?</p><button type="button" onClick={() => setShowRegisterModal(true)} className="w-full py-2.5 bg-emerald-50 dark:bg-slate-700 text-emerald-800 dark:text-emerald-300 font-bold rounded-2xl border border-emerald-200 dark:border-slate-600">➕ Register New Mosque</button></div>
                  </div>
                )}
              </main>
            )}

              <button onClick={() => setCurrentTab('profile')} className={`flex flex-col items-center gap-0.5 text-[11px] font-bold pb-1 relative ${currentTab === 'profile' ? 'text-emerald-700' : 'text-slate-400'}`}><svg className="w-5 h-5" fill={currentTab === 'profile' ? 'currentColor' : 'none'} stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><span>Profile</span></button>
            </nav>

            {/* PERMISSION (pehli baar) */}

                      <input type="time" required value={ramzanDraft.sehri} onChange={(e) => setRamzanDraft(p => ({ ...p, sehri: e.target.value }))} className="flex-1 p-1 bg-transparent text-base font-bold outline-none" />
                    </div>
                    <div className="flex items-center gap-2 border rounded-xl p-2.5 dark:bg-slate-700 dark:border-slate-600 bg-white">
                      <span className="text-lg">🕒</span>

                      <input type="time" required value={ramzanDraft.iftar} onChange={(e) => setRamzanDraft(p => ({ ...p, iftar: e.target.value }))} className="flex-1 p-1 bg-transparent text-base font-bold outline-none" />

                  </form>
                </div>
              </div>

            {/* QR FULL SCREEN */}
            {qrFull && (

              </div>
            )}

            {/* EDIT INFO MODAL (imam) */}
            {showInfoEditModal && loggedImamMasjid && (
              <div className="fixed inset-0 z-[200] bg-black/60 flex items-center justify-center p-4">
                <div className={`${darkMode ? 'bg-slate-800' : 'bg-white'} rounded-3xl p-5 max-w-sm w-full space-y-3 shadow-2xl border dark:border-slate-700 max-h-[92vh] overflow-y-auto`}>

                      <div className="space-y-2 pl-2 border-l-2 border-emerald-200">
                        {infoField('Maktab Timing', 'maktabTime', 'e.g. 4:00 PM to 6:00 PM', 'text', true)}

                        {infoField('Classes', 'maktabClasses', 'e.g. Nazra, Hifz, Girls Batch')}
                        {infoField('Teacher Name', 'ustaadName', 'e.g. Hafiz Zaid')}
                        {infoField('Teacher Phone', 'ustaadPhone', 'e.g. 9876543210', 'tel')}
                      </div>
                    )}
                    <div className="font-bold text-[#07382c] dark:text-emerald-300 pt-1">🕌 Special Prayers</div>

                    {infoField('Eid Prayer Time', 'eidTime', 'e.g. 8:00 AM', 'text', true)}
                    {infoField('Taraweeh Time', 'taraweeh', 'e.g. 20 Rakat, 9:00 PM', 'text', true)}

                    <div className="font-bold text-[#07382c] dark:text-emerald-300 pt-1">👥 Committee / Mutawalli</div>
                    {infoField('Mutawalli / Committee Name', 'committeeName', 'e.g. Janab Salim Khan')}
                    {infoField('Mutawalli Mobile Number', 'committeePhone', 'e.g. 9876543210', 'tel')}
                    <div className="font-bold text-[#07382c] dark:text-emerald-300 pt-1">💝 Donation (UPI)</div>
                    {infoField('Masjid UPI ID (Optional)', 'upiId', 'e.g. masjid@upi')}

                      <div className="flex gap-2 justify-center"><label htmlFor="qr-photo-input" className="px-3 py-2 bg-[#07382c] text-white text-[11px] font-bold rounded-lg cursor-pointer">📸 {infoDraft.upiQr ? 'Change UPI QR Photo' : 'Upload UPI QR Photo'}</label>{infoDraft.upiQr && <button type="button" onClick={() => setD('upiQr', '')} className="px-3 py-2 bg-rose-50 text-rose-600 border border-rose-200 text-[11px] font-bold rounded-lg">Remove</button>}</div>
                      <p className="text-[10px] text-slate-500 text-center">Upload clear, straight QR code screenshot.</p>
                    </div>
                    <div className="flex gap-2 pt-2"><button type="button" onClick={() => setShowInfoEditModal(false)} className="w-1/2 py-2.5 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold">Cancel</button><button type="submit" className="w-1/2 py-2.5 bg-[#07382c] text-white rounded-xl font-bold shadow">Save</button></div>
                  </form>
                </div>
              </div>
            )}

            {/* NOTIFICATION MODAL FIXED */}
            {showNotificationsModal && (
              <div className="fixed inset-0 z-[200] bg-black/70 flex items-center justify-center p-4">
                 <div className={`${darkMode ? 'bg-slate-800' : 'bg-white'} rounded-3xl p-5 max-w-sm w-full space-y-3 shadow-2xl`}>
                    <div className="flex justify-between border-b pb-2 dark:border-slate-700"><h3 className="font-extrabold flex gap-1"><span>🔔</span> मस्जिद की सूचनाएं</h3><button onClick={() => setShowNotificationsModal(false)}>✕</button></div>

                       {!notifModalItems.length ? <p className="text-center text-xs py-4 text-slate-500">कोई नई सूचना नहीं है।<br/><span className="text-[10px]">पुराने ऐलान होम पेज पर "ताज़ा ऐलान" में देखें।</span></p> : notifModalItems.map(n => (
                           <div key={n.id} className="p-2.5 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600">
                               <h4 className="font-bold text-xs text-emerald-900 dark:text-emerald-300">{n.title}</h4>
                               <p className="text-[11px] mt-1 font-medium">{n.message}</p>
                               <span className="text-[9px] text-slate-400 mt-1.5 block">{n.date}</span>
                           </div>
                       ))}
                    </div>
                    <button onClick={() => setShowNotificationsModal(false)} className="w-full py-2 bg-[#07382c] text-white rounded-xl text-xs font-bold">बंद करें</button>
                 </div>
              </div>
            )}

            {showForgotCredentialsModal && (
              <div className="fixed inset-0 z-[200] bg-black/75 flex items-center justify-center p-4">
                <div className={`${darkMode ? 'bg-slate-800' : 'bg-white'} rounded-3xl p-5 max-w-sm w-full space-y-3 shadow-2xl max-h-[92vh] overflow-y-auto`}>
                  <div className="flex justify-between border-b pb-2 dark:border-slate-700"><h3 className="font-black text-sm">🔑 ID खोजें / लॉगिन</h3><button onClick={() => setShowForgotCredentialsModal(false)}>✕</button></div>

                    <div>
                        <label className="font-bold block mb-1">मोबाइल नंबर या मस्जिद का नाम:</label>
                        <input type="text" value={forgotSearchQuery} onChange={(e) => setForgotSearchQuery(e.target.value)} placeholder="उदा: 9876543210" className="w-full p-2.5 border rounded-xl dark:bg-slate-700 dark:border-slate-600" />
                    </div>
                    <div className="space-y-2 max-h-60 overflow-y-auto">
                      {(() => {
                        const q = forgotSearchQuery.trim().toLowerCase().replace(/[\s\-]/g, '');
                        const list = Object.values(masjids).filter(m => { if(!q) return true; return (m.phone||'').includes(q) || (m.name||'').toLowerCase().includes(q) || (m.id||'').toLowerCase().includes(q); });
                        if(list.length === 0) return <p className="text-center text-rose-500 py-2">कोई मस्जिद नहीं मिली।</p>;
                        return list.map(m => (
                          <div key={m.id} className="p-2 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 flex flex-col gap-1">
                            <div className="flex justify-between"><strong className="text-sm">{m.name}</strong><span className="text-[10px] text-emerald-700 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-900/30 px-2 rounded">ID: {m.id}</span></div>

                            <button onClick={() => handleDirectLoginFromRecovery(m.id)} className="mt-1 w-full py-1.5 bg-[#07382c] text-white rounded-lg text-[10px] font-bold">लॉगिन करें ➔</button>
                          </div>
                        ));
                      })()}
                    </div>
                  </div>
                </div>

            {showEditProfileModal && loggedImamMasjid && (
              <div className="fixed inset-0 z-[200] bg-black/60 flex items-center justify-center p-4">
                <div className={`${darkMode ? 'bg-slate-800' : 'bg-white'} rounded-3xl p-5 max-w-sm w-full space-y-3 shadow-2xl border dark:border-slate-700 max-h-[92vh] overflow-y-auto`}>
                  <div className="flex justify-between border-b pb-2 dark:border-slate-700"><h3 className="font-extrabold text-sm">✏️ Edit Mosque Profile</h3><button onClick={() => setShowEditProfileModal(false)}>✕</button></div>
                  <form onSubmit={handleSaveProfileEdit} className="space-y-2.5 text-xs">
                    <div className="flex items-center gap-3 p-2 bg-emerald-50 dark:bg-slate-700/80 rounded-xl border border-emerald-100 dark:border-slate-600">
                        <img src={editPhotoUrl || loggedImamMasjid.photo || 'https://images.unsplash.com/photo-1542816417-0983c9c9ad53?auto=format&fit=crop&w=800&q=80'} className="w-14 h-14 rounded-full object-cover border-2 border-emerald-500" />
