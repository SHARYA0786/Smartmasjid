                    e.preventDefault(); const form = e.target; const id = form.mId.value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '');
                    if (!id) { showToast('❌ सही मस्जिद ID लिखें (अक्षर/अंक)', 'error'); return; }
                    if (Object.keys(masjids).some(k => k.toUpperCase() === id)) { showToast('❌ ये ID पहले से मौजूद है, दूसरी ID चुनें', 'error'); return; }
                    const finalLat = parseFloat(regLat) || userLocation.lat || 28.6139;
                    const finalLng = parseFloat(regLng) || userLocation.lng || 77.2090;
                    const newM = {
                      id, name: form.mName.value.trim(), address: form.mAddress.value.trim(), stateLocation: form.mCity.value.trim(), phone: form.mPhone.value.trim(), imamName: form.mImam.value.trim(), 
                      photo: regPhotoUrl || 'https://images.unsplash.com/photo-1542816417-0983c9c9ad53?auto=format&fit=crop&w=800&q=80', passcode: form.mPasscode.value.trim(),
                      lat: finalLat, lng: finalLng, dailyHadith: '“Ilm hasil karna har Musalman mard aur aurat par farz hai.”', dailyHadithRef: '— (Ibn Majah)', hijriDateStr: (getHijriToday() || '1 Muharram 1448'), lastDateSetISO: new Date().toISOString().slice(0, 10), registeredAtISO: new Date().toISOString(), schedule: defaultSchedule, updatedAt: Date.now()
                    };
                    publishMasjidUpdate(newM); setSelectedMasjidId(id); setFavorites([id]); setLoggedImamMasjidId(id);
                    setUserLocation({ lat: finalLat, lng: finalLng }); setHasGps(true); safeStorageSet('mc_user_location', JSON.stringify({ lat: finalLat, lng: finalLng })); safeStorageSet('mc_logged_imam_masjid_id', id); safeStorageSet('mc_selected_masjid_id', id); safeStorageSet('mc_user_favorites', JSON.stringify([id]));
                    setShowRegisterModal(false); setCurrentTab('profile'); showToast(`✅ रजिस्टर हो गई। ID: ${id}`);
                  }} className="space-y-3 text-xs">
                    <div className="flex items-center gap-3 p-2 bg-emerald-50 dark:bg-slate-700/80 rounded-xl border border-emerald-100 dark:border-slate-600">
                        <img src={regPhotoUrl || 'https://images.unsplash.com/photo-1542816417-0983c9c9ad53?auto=format&fit=crop&w=800&q=80'} className="w-14 h-14 rounded-full object-cover border-2 border-emerald-500" />
                        <div><input type="file" id="reg-photo-input" accept="image/*" className="hidden" onChange={handleGalleryPhotoUpload} /><label htmlFor="reg-photo-input" className="px-3 py-1.5 bg-[#07382c] text-white text-[10px] font-bold rounded-lg cursor-pointer shadow-sm">📸 गैलरी से फोटो चुनें</label></div>
                    </div>
                    <div className="p-2 bg-emerald-50 dark:bg-slate-700/80 rounded-2xl border dark:border-slate-600">
                      <div className="flex justify-between items-center mb-1"><span className="font-extrabold text-emerald-950 dark:text-emerald-300">📍 GPS लोकेशन</span><button type="button" onClick={()=>handleFetchGpsLocation(false)} className="px-2 py-1 bg-[#07382c] text-white rounded text-[10px]">🔄 रिफ्रेश</button></div>
                      <div className="grid grid-cols-2 gap-2 text-[10px]"><div><label className="font-bold">Latitude:</label><input type="number" step="any" value={regLat} onChange={(e)=>setRegLat(e.target.value)} className="w-full p-1.5 border rounded dark:bg-slate-800 dark:border-slate-600" required /></div><div><label className="font-bold">Longitude:</label><input type="number" step="any" value={regLng} onChange={(e)=>setRegLng(e.target.value)} className="w-full p-1.5 border rounded dark:bg-slate-800 dark:border-slate-600" required /></div></div>
                    </div>
                    <div><label className="font-bold block mb-1">मस्जिद का नाम</label><input type="text" name="mName" placeholder="उदा: जामा मस्जिद" required className="w-full p-2.5 border rounded-2xl dark:bg-slate-700 dark:border-slate-600" /></div>
                    <div className="grid grid-cols-2 gap-2"><div><label className="font-bold block mb-1">पता</label><input name="mAddress" placeholder="पता" required className="w-full p-2.5 border rounded-2xl dark:bg-slate-700 dark:border-slate-600" /></div><div><label className="font-bold block mb-1">शहर</label><input name="mCity" placeholder="शहर" required className="w-full p-2.5 border rounded-2xl dark:bg-slate-700 dark:border-slate-600" /></div></div>
                    <div className="grid grid-cols-2 gap-2"><div><label className="font-bold block mb-1">मोबाइल नंबर</label><input name="mPhone" type="tel" placeholder="मोबाइल" required className="w-full p-2.5 border rounded-2xl dark:bg-slate-700 dark:border-slate-600" /></div><div><label className="font-bold block mb-1">इमाम का नाम</label><input name="mImam" placeholder="नाम" required className="w-full p-2.5 border rounded-2xl dark:bg-slate-700 dark:border-slate-600" /></div></div>
                    <div className="grid grid-cols-2 gap-2"><div><label className="font-bold block mb-1 text-[10px]">मस्जिद ID *</label><input name="mId" defaultValue={'MASJID-' + Math.floor(100 + Math.random() * 900)} required className="w-full p-2 border rounded-xl font-mono font-bold uppercase dark:bg-slate-700 dark:border-slate-600" /></div><div><label className="font-bold block mb-1 text-[10px]">पासवर्ड *</label><input name="mPasscode" defaultValue="786" required className="w-full p-2 border rounded-xl font-mono font-bold dark:bg-slate-700 dark:border-slate-600" /></div></div>
                    <div className="flex gap-2 pt-1"><button type="button" onClick={() => setShowRegisterModal(false)} className="w-1/3 py-2.5 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold text-xs">रद्द</button><button type="submit" className="w-2/3 py-2.5 bg-[#07382c] text-white rounded-xl font-black text-xs">✅ रजिस्टर करें</button></div>
                  </form>
                </div>
              </div>
            )}

            {/* CHANGE PASSWORD MODAL */}
            {showChangePasswordModal && (
               <div className="fixed inset-0 z-[200] bg-black/70 flex items-center justify-center p-4">
                  <div className={`${darkMode ? 'bg-slate-800' : 'bg-white'} rounded-3xl p-5 max-w-sm w-full space-y-3.5 border shadow-2xl dark:border-slate-700`}>
                     <div className="flex justify-between border-b pb-2 dark:border-slate-700"><h3 className="font-extrabold text-sm">🔑 नया पासवर्ड बनाएं</h3><button onClick={() => setShowChangePasswordModal(false)}>✕</button></div>
                     <form onSubmit={handleImamChangePassword} className="space-y-3 text-xs">
                        <div><label className="font-bold block mb-1">नया पासवर्ड</label><input type="text" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="w-full p-2 border rounded-xl font-mono dark:bg-slate-700 dark:border-slate-600" placeholder="नया पासवर्ड" required/></div>
                        <div><label className="font-bold block mb-1">पासवर्ड दोबारा लिखें</label><input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full p-2 border rounded-xl font-mono dark:bg-slate-700 dark:border-slate-600" placeholder="दोबारा लिखें" required/></div>
                        <div className="flex gap-2 pt-2"><button type="button" onClick={() => setShowChangePasswordModal(false)} className="w-1/2 py-2.5 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold">रद्द</button><button type="submit" className="w-1/2 py-2.5 bg-[#07382c] text-white rounded-xl font-bold">बदलें</button></div>
                     </form>
                  </div>
               </div>
            )}

            {/* EDIT TIME MODAL */}
            {showEditTimeModal && (
              <div className="fixed inset-0 z-[200] bg-black/70 flex justify-center items-center p-3.5">
                <div className={`${darkMode ? 'bg-slate-800' : 'bg-white'} rounded-3xl p-4 max-w-sm w-full space-y-3 shadow-2xl border max-h-[95vh] overflow-y-auto dark:border-slate-700`}>
                  <div className="flex justify-between border-b pb-2 dark:border-slate-700"><h3 className="font-extrabold text-sm">🕒 नमाज़ समय व तारीख़ें</h3><button onClick={() => setShowEditTimeModal(false)}>✕</button></div>
                  <form onSubmit={handleSaveScheduleInstant} className="space-y-3 text-[11px]">
                    <div className="grid grid-cols-2 gap-2"><div><label className="font-bold block mb-1">English Date</label><input value={editEnglishDate} onChange={(e) => setEditEnglishDate(e.target.value)} className="w-full p-1.5 border rounded-lg dark:bg-slate-700 dark:border-slate-600" required /></div><div><label className="font-bold block mb-1">Hijri Date</label><input value={editHijriDate} onChange={(e) => setEditHijriDate(e.target.value)} className="w-full p-1.5 border rounded-lg font-bold dark:bg-slate-700 dark:border-slate-600" required /></div></div>
                    <div className="space-y-1">
                      {[{ key: 'fajr', label: 'Fajr', jamatKey: 'fajrJamat' },{ key: 'zuhr', label: 'Zuhr', jamatKey: 'zuhrJamat' },{ key: 'asr', label: 'Asr', jamatKey: 'asrJamat' },{ key: 'maghrib', label: 'Maghrib', jamatKey: 'maghribJamat' },{ key: 'isha', label: 'Isha', jamatKey: 'ishaJamat' }].map((p) => (
                        <div key={p.key} className="flex justify-between items-center p-1.5 rounded-lg border bg-slate-50 dark:bg-slate-700 dark:border-slate-600"><span className="font-bold w-12">{p.label}</span><div className="flex items-center gap-1">Azan: <input type="time" value={editSchedule[p.key] || ''} onChange={(e) => setEditSchedule({ ...editSchedule, [p.key]: e.target.value })} className="p-1 border rounded w-16 dark:bg-slate-800 dark:border-slate-700" required /></div><div className="flex items-center gap-1 font-bold text-emerald-700 dark:text-emerald-400">Jamat: <input type="time" value={editSchedule[p.jamatKey] || ''} onChange={(e) => setEditSchedule({ ...editSchedule, [p.jamatKey]: e.target.value })} className="p-1 border rounded w-16 dark:bg-slate-800 dark:border-slate-700" required /></div></div>
                      ))}
                    </div>
                    <div className="p-2 border rounded-lg bg-amber-50 dark:bg-amber-900/10 dark:border-amber-900/30">
                        <span className="font-bold block mb-2 text-center text-xs text-amber-900 dark:text-amber-400">अन्य समय (तुलू, ग़ुरूब व जुमा)</span>
                        <div className="grid grid-cols-2 gap-2 mb-2"><div><label className="font-bold block mb-1">🌅 Sunrise</label><input type="time" value={editSchedule.sunrise || ''} onChange={(e) => setEditSchedule({ ...editSchedule, sunrise: e.target.value })} className="w-full p-1.5 border rounded font-bold dark:bg-slate-800 dark:border-slate-700" required /></div><div><label className="font-bold block mb-1">🌇 Sunset</label><input type="time" value={editSchedule.sunset || ''} onChange={(e) => setEditSchedule({ ...editSchedule, sunset: e.target.value })} className="w-full p-1.5 border rounded font-bold dark:bg-slate-800 dark:border-slate-700" required /></div></div>
                        <div className="border-t pt-2 border-amber-200 dark:border-amber-900/30"><label className="font-bold block mb-1">🕌 Juma (जुमा)</label><div className="flex gap-2"><div className="w-1/2">Azan: <input type="time" value={editSchedule.jumaAzan || ''} onChange={(e) => setEditSchedule({ ...editSchedule, jumaAzan: e.target.value })} className="w-full p-1.5 border rounded mt-0.5 dark:bg-slate-800 dark:border-slate-700" required /></div><div className="w-1/2 font-bold text-emerald-700 dark:text-emerald-400">Jamat: <input type="time" value={editSchedule.jumaJamat || ''} onChange={(e) => setEditSchedule({ ...editSchedule, jumaJamat: e.target.value })} className="w-full p-1.5 border rounded mt-0.5 font-bold dark:bg-slate-800 dark:border-slate-700" required /></div></div></div>
                    </div>
                    <div className="flex gap-2 pt-2"><button type="button" onClick={() => setShowEditTimeModal(false)} className="w-1/3 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold">रद्द</button><button type="submit" className="w-2/3 py-2 bg-[#07382c] text-white rounded-xl font-bold">💾 सेव करें</button></div>
                  </form>
                </div>
              </div>
            )}

            {/* DELETE SAFETY MODAL */}
            {showDeleteSafetyModal && (
               <div className="fixed inset-0 z-[200] bg-black/75 flex justify-center items-center p-4"><div className={`${darkMode ? 'bg-slate-800' : 'bg-white'} rounded-3xl p-5 max-w-sm w-full space-y-3.5 border-2 border-rose-300`}><h3 className="font-black text-rose-600 text-sm">मस्जिद डिलीट करें?</h3><input type="password" value={deletePasswordInput} onChange={(e) => setDeletePasswordInput(e.target.value)} placeholder="मस्जिद पासवर्ड दर्ज करें" className="w-full p-2 border-2 rounded-xl dark:bg-slate-700 dark:border-slate-600" /><div className="flex gap-2"><button onClick={()=>setShowDeleteSafetyModal(false)} className="w-1/2 py-2 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold">रद्द</button><button onClick={executeDeleteMasjidProfile} className="w-1/2 py-2 bg-rose-600 text-white rounded-xl font-bold">🗑️ डिलीट</button></div></div></div>
            )}
            
            {/* EDIT HADITH MODAL */}
            {showEditHadithModal && (
              <div className="fixed inset-0 z-[200] bg-black/60 flex justify-center items-center p-4"><div className={`${darkMode ? 'bg-slate-800' : 'bg-white'} rounded-3xl p-5 max-w-sm w-full space-y-3 border dark:border-slate-700`}><h3 className="font-bold text-sm">📖 आज की हदीस अपडेट करें</h3><form onSubmit={handleSaveHadithInstant} className="space-y-3 text-xs"><textarea rows={3} value={editHadithText} onChange={(e) => setEditHadithText(e.target.value)} className="w-full p-2.5 border rounded-xl dark:bg-slate-700 dark:border-slate-600 font-urdu" required /><input type="text" value={editHadithRef} onChange={(e) => setEditHadithRef(e.target.value)} placeholder="हवाला" className="w-full p-2 border rounded-xl dark:bg-slate-700 dark:border-slate-600" /><div className="flex gap-2 pt-1"><button type="button" onClick={() => setShowEditHadithModal(false)} className="w-1/2 py-2 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold">रद्द</button><button type="submit" className="w-1/2 py-2 bg-[#07382c] text-white rounded-xl font-bold shadow">सेव करें</button></div></form></div></div>
            )}

            {/* SEND NOTICE MODAL */}
            {showNewNoticeModal && (
              <div className="fixed inset-0 z-[200] bg-black/60 flex justify-center items-center p-4"><div className={`${darkMode ? 'bg-slate-800' : 'bg-white'} rounded-3xl p-5 max-w-sm w-full space-y-3 border dark:border-slate-700`}><h3 className="font-bold text-sm">📢 नया ऐलान पोस्ट करें</h3><form onSubmit={handlePostNotice} className="space-y-2.5 text-xs"><input type="text" placeholder="ऐलान का शीर्षक" value={newNoticeTitle} onChange={(e) => setNewNoticeTitle(e.target.value)} className="w-full p-2 border rounded-xl dark:bg-slate-700 dark:border-slate-600" required /><textarea rows={3} placeholder="पूरा पैग़ाम..." value={newNoticeMessage} onChange={(e) => setNewNoticeMessage(e.target.value)} className="w-full p-2 border rounded-xl dark:bg-slate-700 dark:border-slate-600 font-urdu" required /><div className="flex gap-2"><button type="button" onClick={() => setShowNewNoticeModal(false)} className="w-1/2 py-2 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold">रद्द</button><button type="submit" className="w-1/2 py-2 bg-[#07382c] text-white rounded-xl font-bold">भेजें</button></div></form></div></div>
            )}
            
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<MasjidConnectApp />);
    </script>
</body>
</html>
