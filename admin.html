<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const firebaseConfig = {

try {

/* ================= DEFAULT SETTINGS ================= */
const DEF = {

/* ================= HELPERS ================= */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const addMonths = (s, n) => {
  const d = new Date(s + 'T00:00:00');
  const day = d.getDate();
  d.setMonth(d.getMonth() + n);
  if (d.getDate() < day) d.setDate(0);
  return iso(d);
};
const daysLeft = s => s ? Math.ceil((new Date(s + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 86400000) : null;
const eff = m => {
  const s = m.paymentStatus || 'free';
  return (s === 'paid' && m.paymentExpiry && m.paymentExpiry < today()) ? 'expired' : s;
};
const hasGps = m => typeof m.lat === 'number' && !isNaN(m.lat) && m.lat !== 0;

const compress = (file, max = 400, q = 0.8) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onerror = rej;
  r.onload = e => {
    const im = new Image();
    im.onerror = rej;
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k);
      c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q));
    };
    im.src = e.target.result;
  };
  r.readAsDataURL(file);
});

const upiLink = (upi, name, amt) => `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name || 'Masjid Connect')}&cu=INR${amt ? '&am=' + amt : ''}`;
const qrImg = (upi, name, amt) => `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(upiLink(upi, name, amt))}`;
const csvCell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
const waLink = (phone, text) => `https://wa.me/${(String(phone || '').replace(/\D/g, '').length === 10 ? '91' : '') + String(phone || '').replace(/\D/g, '')}?text=${encodeURIComponent(text)}`;

const card = 'rounded-2xl border bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 shadow-sm';
const inp = 'w-full p-2.5 rounded-xl border text-sm bg-white dark:bg-slate-700 border-slate-300 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-[var(--ac)] text-slate-900 dark:text-white';
const B = 'px-3 py-2 rounded-xl text-xs font-bold active:scale-95 transition cursor-pointer select-none';

const Modal = ({ title, sub, onClose, children, wide }) => (
  <div className="fixed inset-0 z-[200] bg-black/60 flex items-center justify-center p-3 animate-fade-in" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className={`${card} w-full ${wide ? 'max-w-3xl' : 'max-w-lg'} max-h-[92vh] overflow-y-auto thin shadow-2xl`}>
      <div className="sticky top-0 z-10 flex items-start justify-between gap-3 p-4 border-b dark:border-slate-700 bg-white dark:bg-slate-800 rounded-t-2xl">
        <div>
          <h3 className="font-extrabold text-base text-slate-900 dark:text-white">{title}</h3>
          {sub && <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{sub}</p>}
        </div>
        <button onClick={onClose} className="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold flex items-center justify-center transition">✕</button>
      </div>
      <div className="p-4">{children}</div>
    </div>
  </div>
);

const Row = ({ l, v }) => (v === undefined || v === null || v === '' ? null : <div className="flex justify-between gap-4 py-1.5 border-b border-slate-100 dark:border-slate-700/60 text-sm"><span className="text-slate-500 shrink-0">{l}</span><b className="text-right break-words text-slate-900 dark:text-slate-100">{v}</b></div>);
const Chip = ({ c, children }) => <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${c}`}>{children}</span>;
const STAT = { paid: 'bg-emerald-600 text-white', free: 'bg-sky-600 text-white', expired: 'bg-rose-600 text-white', pending: 'bg-amber-500 text-slate-900' };

function AdminApp() {
  /* ================= AUTHENTICATION & LOGIN ================= */
  const [user, setUser] = useState(undefined);
  const [loginMode, setLoginMode] = useState('credentials'); // 'credentials' | 'passcode'
  const [lInput, setLInput] = useState(''); // Email or 10-digit mobile
  const [lPass, setLPass] = useState('');
  const [lPasscode, setLPasscode] = useState('');
  const [lErr, setLErr] = useState('');
  const [lLoading, setLLoading] = useState(false);

  // Load saved session
  useEffect(() => {
    const saved = localStorage.getItem('mca_admin_session');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && (parsed.email || parsed.uid)) {
          setUser(parsed);
        }
      } catch (e) {}
    }
    if (auth) {
      const unsub = auth.onAuthStateChanged(u => {
        if (u) {
          setUser({ email: u.email, uid: u.uid });
          localStorage.setItem('mca_admin_session', JSON.stringify({ email: u.email, uid: u.uid }));
        } else {
          if (!localStorage.getItem('mca_admin_session')) setUser(null);
        }
      });
      return () => unsub();
    } else {
      if (!saved) setUser(null);
    }
  }, []);

  /* ================= APP STATE ================= */
  const [S, setS] = useState(() => {
    try { return { ...DEF, ...JSON.parse(localStorage.getItem('mca_settings') || '{}') }; } catch (e) { return DEF; }
  });
  const [masjids, setMasjids] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [logs, setLogs] = useState([]);
  const [reqs, setReqs] = useState([]);
  const [anns, setAnns] = useState([]);
  const [live, setLive] = useState({});
  const [online, setOnline] = useState(false);
  const [page, setPage] = useState('dashboard'); // 'dashboard' | 'masjids' | 'regions' | 'plans' | 'broadcast' | 'settings'
  const [drawer, setDrawer] = useState(false);
  const [dark, setDark] = useState(() => localStorage.getItem('mca_dark') ? localStorage.getItem('mca_dark') === '1' : false);
  const [toast, setToast] = useState(null);

  // Modals
  const [view, setView] = useState(null);
  const [edit, setEdit] = useState(null);
  const [planM, setPlanM] = useState(null);
  const [del, setDel] = useState(null);
  const [confirm, setConfirm] = useState(null);

  // Filters
  const [q, setQ] = useState('');
  const [fState, setFState] = useState('all');
  const [fStat, setFStat] = useState('all');

  // Drafts & inputs
  const [draft, setDraft] = useState(S);
  const [nt, setNt] = useState('');
  const [nb, setNb] = useState('');
  const [bulkPricingModal, setBulkPricingModal] = useState(false);
  const [bulkSeasonalFee, setBulkSeasonalFee] = useState(299);
  const [bulkSeasonalNote, setBulkSeasonalNote] = useState('Ramadan Mubarak Special: Annual Access ₹299');
  const [regionFilter, setRegionFilter] = useState('');
  const swept = useRef({});

  const say = (m, t = 'ok') => {
    setToast({ m, t });
    setTimeout(() => setToast(x => (x && x.m === m ? null : x)), 3800);
  };

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    localStorage.setItem('mca_dark', dark ? '1' : '0');
  }, [dark]);

  useEffect(() => {
    document.documentElement.style.setProperty('--ac', S.accent || DEF.accent);
    document.title = `${S.brand} — Admin Control Center`;
  }, [S.accent, S.brand]);

  /* ================= REALTIME DATA SYNC ================= */
  useEffect(() => {
    if (!user || !db) return;
    const off = [];

    // 1. All Masjids
    off.push(db.collection('masjids').onSnapshot(sn => {
      setMasjids(prev => {
        const n = { ...prev };
        sn.docChanges().forEach(c => {
          if (c.type === 'removed') delete n[c.doc.id];
          else n[c.doc.id] = { id: c.doc.id, ...c.doc.data() };
        });
        return n;
      });
      setLoaded(true);
    }, e => say('Firestore: ' + e.message, 'err')));

    // 2. Admin Settings
    off.push(db.collection('config').doc('admin_settings').onSnapshot(d => {
      if (d.exists) {
        setS(p => {
          const m = { ...DEF, ...p, ...d.data() };
          localStorage.setItem('mca_settings', JSON.stringify({ ...m, logo: '' }));
          return m;
        });
      }
    }));

    // 3. Global Announcements
    off.push(db.collection('config').doc('global_announcements').onSnapshot(d => {
      if (d.exists && Array.isArray(d.data().list)) setAnns(d.data().list);
    }));

    // 4. Payment Logs
    off.push(db.collection('payment_log').orderBy('ts', 'desc').limit(500).onSnapshot(sn => {
      setLogs(sn.docs.map(d => ({ id: d.id, ...d.data() })));
    }));

    // 5. Payment Requests
    off.push(db.collection('payment_requests').onSnapshot(sn => {
      setReqs(sn.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => !r.status || r.status === 'pending'));
    }));

    return () => off.forEach(f => f && f());
  }, [user]);

  useEffect(() => { setDraft(S); }, [S]);

  // MQTT Connection & Realtime Live Status
  useEffect(() => {
    if (!mq) return;
    const onC = () => {
      setOnline(true);
      mq.subscribe([`${TOPIC}/live_broadcast`, `${TOPIC}/events`]);
    };
    const onM = (t, msg) => {
      try {
        const s = JSON.parse(msg.toString());
        if (s && s.masjidId) {
          setLive(p => {
            const n = { ...p };
            if (s.isLive && Date.now() - (s.ts || 0) < 45000) n[s.masjidId] = Date.now();
            else delete n[s.masjidId];
            return n;
          });
        }
      } catch (e) {}
    };
    mq.on('connect', onC);
    mq.on('close', () => setOnline(false));
    mq.on('message', onM);
    if (mq.connected) onC();
    const t = setInterval(() => {
      setLive(p => {
        const n = {};
        Object.keys(p).forEach(k => {
          if (Date.now() - p[k] < 45000) n[k] = p[k];
        });
        return n;
      });
    }, 10000);
    return () => {
      clearInterval(t);
      mq.removeListener('connect', onC);
      mq.removeListener('message', onM);
    };
  }, []);

  /* ================= WRITES (FIRESTORE + MQTT DUAL BROADCAST) ================= */
  const patch = async (id, data) => {
    const prev = masjids[id] || {};
    const updated = { ...prev, ...data, id, updatedAt: Date.now() };
    setMasjids(p => ({ ...p, [id]: updated }));

    // 1. Firestore Cloud DB
    if (db) {
      try { await db.collection('masjids').doc(id).set(updated, { merge: true }); } catch (e) { console.warn(e); }
    }
    // 2. Realtime MQTT retained sync
    try {
      if (mq && mq.connected) {
        mq.publish(`${TOPIC}/db/${id}`, JSON.stringify(updated), { retain: true, qos: 1 });
      }
    } catch (e) {}
    return updated;
  };

  const batchPatch = async (list, fn) => {
    const updatedMap = {};
    list.forEach(m => {
      const changes = fn(m);
      updatedMap[m.id] = { ...m, ...changes, updatedAt: Date.now() };
    });

    setMasjids(prev => ({ ...prev, ...updatedMap }));

    // 1. Batch write to Firestore in chunks of 400
    if (db) {
      for (let i = 0; i < list.length; i += 400) {
        const batch = db.batch();
        list.slice(i, i + 400).forEach(m => {
          batch.set(db.collection('masjids').doc(m.id), updatedMap[m.id], { merge: true });
        });
        await batch.commit();
      }
    }

    // 2. Broadcast updates to MQTT
    try {
      if (mq && mq.connected) {
        Object.values(updatedMap).forEach(u => {
          mq.publish(`${TOPIC}/db/${u.id}`, JSON.stringify(u), { retain: true, qos: 1 });
        });
        mq.publish(`${TOPIC}/events`, JSON.stringify({ type: 'BATCH_MASJIDS_UPDATED', count: list.length, ts: Date.now() }), { qos: 1 });
      }
    } catch (e) {}
  };

  const logPay = (m, plan, amount, note) => {
    if (!db) return;
    return db.collection('payment_log').add({
      masjidId: m.id,
      masjidName: m.name,
      plan,
      amount: Number(amount) || 0,
      note: note || '',
      date: today(),
      ts: Date.now()
    });
  };

  /* auto-expire: paid plan date nikalte hi access auto-lock */
  useEffect(() => {
    if (!loaded || !db) return;
    const exp = Object.values(masjids).filter(m => m.paymentStatus === 'paid' && m.paymentExpiry && m.paymentExpiry < today() && !swept.current[m.id + m.paymentExpiry]);
    if (!exp.length) return;
    exp.forEach(m => swept.current[m.id + m.paymentExpiry] = 1);
    batchPatch(exp, () => ({ paymentStatus: 'expired', liveAzanAllowed: false, timeEditAllowed: false }))
      .then(() => say(`${exp.length} plan expired — access locked automatically`));
  }, [loaded, masjids]);

  const activate = async (m, plan, status) => {
    const months = plan === 'monthly' ? 1 : 12;
    const amount = plan === 'monthly' ? S.monthlyFee : S.yearlyFee;
    const base = (m.paymentExpiry && m.paymentExpiry >= today() && eff(m) === 'paid') ? m.paymentExpiry : today();
    const expiry = addMonths(base, months);
    await patch(m.id, {
      paymentPlan: plan,
      paymentStatus: 'paid',
      paymentExpiry: expiry,
      paymentAmount: amount,
      paymentStart: today(),
      liveAzanAllowed: true,
      timeEditAllowed: true,
      pendingUtr: null
    });
    await logPay(m, plan, amount, status || 'Admin activated');
    say(`${m.name}: ${plan === 'monthly' ? '1 Month' : '1 Year'} activated till ${expiry}`);
  };

  const approveReq = async (r, plan) => {
    const m = masjids[r.masjidId];
    if (!m) return say('Masjid not found', 'err');
    await activate(m, plan, 'UTR ' + (r.utr || ''));
    await db.collection('payment_requests').doc(r.id).set({ status: 'approved', approvedAt: Date.now(), plan }, { merge: true });
  };

  const rejectReq = async r => {
    await db.collection('payment_requests').doc(r.id).set({ status: 'rejected', rejectedAt: Date.now() }, { merge: true });
    say('Request rejected');
  };

  const toggle = (m, k, label) => {
    const v = !(m[k] !== false);
    patch(m.id, { [k]: v });
    say(`${m.name}: ${label} ${v ? 'ON' : 'OFF'}`);
  };

  const toggleFlag = (m, k, label) => {
    const v = !m[k];
    patch(m.id, { [k]: v });
    say(`${m.name}: ${label} ${v ? 'ON' : 'OFF'}`);
  };

  const delMasjid = async m => {
    if (db) await db.collection('masjids').doc(m.id).delete();
    try {
      if (mq && mq.connected) {
        mq.publish(`${TOPIC}/db/${m.id}`, '', { retain: true, qos: 1 });
        mq.publish(`${TOPIC}/events`, JSON.stringify({ type: 'MASJID_DELETED', deletedId: m.id }), { qos: 1 });
      }
    } catch (e) {}
    setMasjids(prev => {
      const n = { ...prev };
      delete n[m.id];
      return n;
    });
    setDel(null);
    setView(null);
    say(`${m.name} deleted`);
  };

  const saveSettings = async e => {
    if (e) e.preventDefault();
    const d = {
      ...draft,
      monthlyFee: Number(draft.monthlyFee) || 0,
      yearlyFee: Number(draft.yearlyFee) || 0,
      updatedAt: Date.now()
    };
    if (db) await db.collection('config').doc('admin_settings').set(d, { merge: true });
    try {
      if (mq && mq.connected) {
        mq.publish(`${TOPIC}/db/admin_settings`, JSON.stringify(d), { retain: true, qos: 1 });
      }
    } catch(e) {}
    setS(d);
    say('Settings saved');
  };

  const sendAnn = async e => {
    e.preventDefault();
    if (!nt.trim() || !nb.trim()) return;
    const a = { id: 'ann_' + Date.now(), title: nt.trim(), body: nb.trim(), date: new Date().toLocaleString('en-GB'), ts: Date.now() };
    const list = [a, ...anns].slice(0, 50);
    if (db) await db.collection('config').doc('global_announcements').set({ list, lastUpdated: Date.now() });
    try {
      if (mq && mq.connected) mq.publish(`${TOPIC}/events`, JSON.stringify({ type: 'GLOBAL_ANNOUNCEMENT', announcement: a }), { qos: 1 });
    } catch (e) {}
    setNt('');
    setNb('');
    say('Announcement sent');
  };

  /* ================= 1-CLICK STATE & DISTRICT BAN FUNCTIONS ================= */
  const handleBanState = (stateName) => {
    const affected = all.filter(m => (m.stateName || 'Unknown').trim().toLowerCase() === stateName.trim().toLowerCase());
    setConfirm({
      t: `🚫 Ban Entire State: "${stateName}"?`,
      d: `This will suspend all ${affected.length} mosques in ${stateName}. They will be immediately hidden from the main app and both Live Azan and Time Editing will be locked.`,
      go: async () => {
        await batchPatch(affected, () => ({
          isSuspended: true,
          liveAzanAllowed: false,
          timeEditAllowed: false,
          banReason: `State-wide suspension: ${stateName}`
        }));
        // Update bannedStates list in settings
        const updatedBanned = [...new Set([...(S.bannedStates || []), stateName])];
        const newS = { ...S, bannedStates: updatedBanned };
        setS(newS);
        if (db) db.collection('config').doc('admin_settings').set({ bannedStates: updatedBanned }, { merge: true });
        say(`State "${stateName}" successfully BANNED (${affected.length} mosques)`);
      }
    });
  };

  const handleUnbanState = (stateName) => {
    const affected = all.filter(m => (m.stateName || 'Unknown').trim().toLowerCase() === stateName.trim().toLowerCase());
    setConfirm({
      t: `✅ Restore State: "${stateName}"?`,
      d: `All ${affected.length} mosques in ${stateName} will be restored to active status with Live Azan and Time Editing allowed.`,
      go: async () => {
        await batchPatch(affected, () => ({
          isSuspended: false,
          liveAzanAllowed: true,
          timeEditAllowed: true,
          banReason: null
        }));
        const updatedBanned = (S.bannedStates || []).filter(s => s.toLowerCase() !== stateName.toLowerCase());
        const newS = { ...S, bannedStates: updatedBanned };
        setS(newS);
        if (db) db.collection('config').doc('admin_settings').set({ bannedStates: updatedBanned }, { merge: true });
        say(`State "${stateName}" UNBANNED (${affected.length} mosques active)`);
      }
    });
  };

    setConfirm({
      t: `🚫 Ban Entire District: "${districtName}"?`,

        await batchPatch(affected, () => ({
          isSuspended: true,
          liveAzanAllowed: false,
          timeEditAllowed: false,
          banReason: `District-wide suspension: ${districtName}`
        }));

  /* ================= LOGIN HANDLERS ================= */
  const handleCredentialLogin = async (e) => {
    e.preventDefault();
    setLErr('');
    setLLoading(true);
    const raw = lInput.trim();
    const pass = lPass.trim();

    if (!raw || !pass) {
      setLErr('Email / Mobile Number aur Password dono zaroori hain.');
      setLLoading(false);
      return;
    }

    const cleanDigits = raw.replace(/\D/g, '');
    const isMobile = cleanDigits.length === 10;
    const emailToUse = isMobile ? `admin_${cleanDigits}@masjidconnect.admin` : raw;

    // 1. Direct Master Passcode / Key check
    const masterCodes = ['786', 'admin786', S.adminPasscode || '786'];
    if (masterCodes.includes(pass) || masterCodes.includes(raw)) {
      const adminSession = {
        email: isMobile ? `Admin Mobile (${cleanDigits})` : raw,
        uid: 'superadmin_' + (cleanDigits || 'root'),
        displayName: 'Super Admin',
        isMaster: true
      };
      localStorage.setItem('mca_admin_session', JSON.stringify(adminSession));
      setUser(adminSession);
      setLLoading(false);
      say('Welcome, Super Admin! (Master Passcode Verified)');
      return;
    }

    // 2. Firebase Authentication
    if (auth) {
      try {
        const cred = await auth.signInWithEmailAndPassword(emailToUse, pass);
        localStorage.setItem('mca_admin_session', JSON.stringify({ email: cred.user.email, uid: cred.user.uid }));
        setUser(cred.user);
        setLLoading(false);
        say('Logged in successfully!');
        return;
      } catch (er) {
        // If user not found, try to auto-create admin account
        if (er.code === 'auth/user-not-found' && pass.length >= 6) {
          try {
            const newCred = await auth.createUserWithEmailAndPassword(emailToUse, pass);
            localStorage.setItem('mca_admin_session', JSON.stringify({ email: newCred.user.email, uid: newCred.user.uid }));
            setUser(newCred.user);
            setLLoading(false);
            say('Admin account created & logged in!');
            return;
          } catch (createErr) {}
        }

        let msg = er.message;
        if (er.code === 'auth/wrong-password' || er.code === 'auth/invalid-credential') {
          msg = 'Galat password ya credentials! (Master Passcode "786" bhi use kar sakte hain)';
        } else if (er.code === 'auth/invalid-email') {
          msg = 'Kripya sahi Email ya 10-digit Mobile number dalein.';
        } else if (er.code === 'auth/user-not-found') {
          msg = 'Account nahi mila. Aap Master Passcode (786) se turant login kar sakte hain.';
        }
        setLErr(msg);
      }
    } else {
      if (pass === '786' || pass === 'admin786') {
        const adminSession = { email: raw, uid: 'admin_local', isMaster: true };
        localStorage.setItem('mca_admin_session', JSON.stringify(adminSession));
        setUser(adminSession);
        setLLoading(false);
        return;
      }
      setLErr('Firebase Auth offline hai. Kripya Master Passcode "786" dalein.');
    }
    setLLoading(false);
  };

  const handlePasscodeLogin = (e) => {
    e.preventDefault();
    setLErr('');
    const code = lPasscode.trim();
    const validCodes = ['786', 'admin786', S.adminPasscode || '786'];
    if (validCodes.includes(code)) {
      const adminSession = {
        email: 'superadmin@masjidconnect.com',
        uid: 'superadmin_passcode',
        displayName: 'Super Admin',
        isMaster: true
      };
      localStorage.setItem('mca_admin_session', JSON.stringify(adminSession));

  const exportCsv = list => {

    const rows = list.map(m => [
      m.id, m.name, m.stateLocation, m.stateName, m.address, m.imamName, m.phone,
      m.paymentPlan || 'free', eff(m), m.paymentExpiry || '', m.paymentAmount || 0,
      m.isVerified ? 'Yes' : 'No', m.isSuspended ? 'Yes' : 'No',
      m.liveAzanAllowed === false ? 'Blocked' : 'Allowed',
      m.timeEditAllowed === false ? 'Locked' : 'Allowed',
      m.lat || '', m.lng || '', m.followersCount || 0
    ].map(csvCell).join(','));
    const url = URL.createObjectURL(new Blob(['\uFEFF' + [H.join(','), ...rows].join('\r\n')], { type: 'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `masjids_${today()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    say(`CSV exported (${list.length})`);
  };

  /* ================= DERIVED COMPUTATIONS ================= */
  const all = useMemo(() => Object.values(masjids), [masjids]);
  const states = useMemo(() => [...new Set(all.map(m => (m.stateName || '').trim()).filter(Boolean))].sort(), [all]);

  const list = useMemo(() => {
    const k = q.trim().toLowerCase();
    return all.filter(m => {
      if (k && ![m.name, m.id, m.stateLocation, m.stateName, m.address, m.imamName, m.phone].some(x => String(x || '').toLowerCase().includes(k))) return false;
      if (fState !== 'all' && (m.stateName || '') !== fState) return false;
      const s = eff(m);
      if (fStat === 'paid' || fStat === 'free' || fStat === 'expired' || fStat === 'pending') return s === fStat;
      if (fStat === 'suspended') return !!m.isSuspended;
      if (fStat === 'verified') return !!m.isVerified;
      if (fStat === 'live') return !!live[m.id];
      if (fStat === 'nogps') return !hasGps(m);
      if (fStat === 'locked') return m.liveAzanAllowed === false || m.timeEditAllowed === false;
      return true;
    }).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  }, [all, q, fState, fStat, live]);

  const st = useMemo(() => {
    const c = x => all.filter(x).length;
    const mo = today().slice(0, 7);

      total: all.length,
      active: c(m => !m.isSuspended),
      susp: c(m => m.isSuspended),
      paid: c(m => eff(m) === 'paid'),

      exp: c(m => eff(m) === 'expired'),
      ver: c(m => m.isVerified),

      // State Map
      if (!stateMap[s]) stateMap[s] = { name: s, total: 0, active: 0, suspended: 0, districts: new Set() };
      stateMap[s].total++;
      if (m.isSuspended) stateMap[s].suspended++;
      else stateMap[s].active++;
      stateMap[s].districts.add(d);

      // District Map
      const dk = `${d}__${s}`;
      if (!districtMap[dk]) districtMap[dk] = { name: d, stateName: s, total: 0, active: 0, suspended: 0 };
      districtMap[dk].total++;
      if (m.isSuspended) districtMap[dk].suspended++;
      else districtMap[dk].active++;
    });

    const statesList = Object.values(stateMap).map(st => ({
      ...st,
      districtsCount: st.districts.size,
      isFullyBanned: st.total > 0 && st.suspended === st.total,
      isPartiallyBanned: st.suspended > 0 && st.suspended < st.total
    })).sort((a, b) => b.total - a.total);

    const districtsList = Object.values(districtMap).map(dt => ({
      ...dt,
      isFullyBanned: dt.total > 0 && dt.suspended === dt.total,
      isPartiallyBanned: dt.suspended > 0 && dt.suspended < dt.total
    })).sort((a, b) => b.total - a.total);

    return { statesList, districtsList };
  }, [all]);

  /* ================= LOGIN SCREEN ================= */

          </div>

          {/* Mode Switcher Tabs */}
          <div className="grid grid-cols-2 p-1 bg-slate-100 dark:bg-slate-700/60 rounded-xl text-xs font-bold">
            <button
              type="button"
              onClick={() => { setLoginMode('credentials'); setLErr(''); }}
              className={`py-2 rounded-lg transition ${loginMode === 'credentials' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xs' : 'text-slate-500 hover:text-slate-800 dark:hover:text-white'}`}
            >
              📧 Email / 📱 Mobile

            <button
              type="button"

              className={`py-2 rounded-lg transition ${loginMode === 'passcode' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xs' : 'text-slate-500 hover:text-slate-800 dark:hover:text-white'}`}
            >
              🔐 Master Passcode
            </button>

          {/* Mode 1: Email or Mobile Number Login */}
          {loginMode === 'credentials' && (
            <form onSubmit={handleCredentialLogin} className="space-y-3.5">

                <input

                  onChange={e => setLPass(e.target.value)}

              {lErr && <div className="p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs font-bold">{lErr}</div>}

              <button

          {/* Mode 2: Quick Master Passcode Login */}
          {loginMode === 'passcode' && (

                <input
                  className={`${inp} font-mono text-center text-lg tracking-widest`}

              <button

              >

              <p className="text-[11.5px] text-slate-500 dark:text-slate-400 text-center">
                Default Master Passcode: <span className="font-mono font-bold text-amber-600 dark:text-amber-400">786</span>
              </p>
            </form>
          )}
        </div>
      </div>
    );
  }

  /* ================= MAIN APPLICATION SHELL ================= */
  return (
    <div className="min-h-screen">
      {/* Toast Alert */}
      {toast && (
        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[999] px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold max-w-[92%] text-white transition-all duration-200 ${toast.t === 'err' ? 'bg-rose-600' : 'bg-slate-900 border border-slate-700'}`}>
          {toast.t === 'err' ? '⚠️ ' : '✅ '}{toast.m}
        </div>

      {/* Top Header */}
      <header className="sticky top-0 z-50 text-white shadow-md" style={{ background: `linear-gradient(90deg, ${S.accent}, #063b2c)` }}>

                  <span>🕌 Manage Mosques</span>
                </button>

            {reqs.length > 0 && (
              <button onClick={() => setPage('plans')} className="w-full text-left p-4 rounded-2xl bg-amber-100 dark:bg-amber-900/30 border-2 border-amber-400 font-bold text-sm text-slate-900 dark:text-amber-200 flex items-center justify-between">

            {/* Quick 8 Metrics Grid */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              {[
                ['Total Mosques', st.total, `${st.active} Active · ${st.susp} Suspended`, '🕌'],
                ['Paid (Active)', st.paid, `${st.free} Free · ${st.exp} Expired`, '💳'],
                ['Revenue (Month)', '₹' + st.revMo, `Total Life: ₹${st.revAll}`, '💰'],
                ['Followers', st.fol, `${st.live} Live Azan Broadcasting`, '⭐'],
                ['Verified (Blue Tick)', st.ver, 'Active Badges Granted', '🔵'],

              <label className="flex items-center gap-1.5"><input type="checkbox" name="la" defaultChecked={edit.liveAzanAllowed !== false} /> Live Azan Allowed</label>
              <label className="flex items-center gap-1.5"><input type="checkbox" name="te" defaultChecked={edit.timeEditAllowed !== false} /> Time Edit Allowed</label>
              <label className="flex items-center gap-1.5"><input type="checkbox" name="vf" defaultChecked={!!edit.isVerified} /> 🔵 Verified Blue Tick</label>
              <label className="flex items-center gap-1.5 text-rose-600"><input type="checkbox" name="sp" defaultChecked={!!edit.isSuspended} /> 🚫 Suspended</label>
            </div>
            <div className="flex gap-2 pt-2">
              <button type="button" onClick={() => setEdit(null)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
              <button type="submit" className={`${B} text-white flex-[2] py-3 shadow-md`} style={{ background: S.accent }}>Save Changes</button>
            </div>
          </form>
        </Modal>
      )}

      {/* ============ MODAL: PLAN ============ */}
      {planM && (() => {
        const m = masjids[planM.id] || planM;
        const s = eff(m);

        return (
          <Modal title="Manage Plan & Access" sub={`${m.name} · Current Status: ${s.toUpperCase()}${m.paymentExpiry ? ' till ' + m.paymentExpiry : ''}`} onClose={() => setPlanM(null)}>
            <div className="grid grid-cols-2 gap-2 mb-4">
              <button onClick={() => activate(m, 'monthly').then(() => setPlanM(null))} className="p-3 rounded-2xl text-white font-extrabold text-sm text-left shadow-xs" style={{ background: S.accent }}>
                📅 +1 Month
                <div className="text-xs font-medium opacity-80">₹{S.monthlyFee} · 30 Days Access</div>
              </button>
              <button onClick={() => activate(m, 'yearly').then(() => setPlanM(null))} className="p-3 rounded-2xl bg-slate-900 text-white font-extrabold text-sm text-left shadow-xs">
                🌟 +1 Year
                <div className="text-xs font-medium opacity-80">₹{S.yearlyFee} · 12 Months Access</div>
              </button>
              <button onClick={async () => {
                await patch(m.id, { paymentPlan: 'free', paymentStatus: 'free', paymentAmount: 0, paymentExpiry: null, liveAzanAllowed: true, timeEditAllowed: true });
                say('Marked Free');
                setPlanM(null);
              }} className="p-3 rounded-2xl bg-sky-100 dark:bg-sky-950/60 text-sky-900 dark:text-sky-200 font-bold text-sm text-left">
                🎁 Free / Waived
              </button>
              <button onClick={async () => {
                await patch(m.id, { paymentStatus: 'expired', liveAzanAllowed: false, timeEditAllowed: false });
                say('Access Locked');
                setPlanM(null);
              }} className="p-3 rounded-2xl bg-rose-100 dark:bg-rose-950/60 text-rose-900 dark:text-rose-200 font-bold text-sm text-left">
                🔒 Lock Access Now
              </button>
            </div>

            <form className="space-y-3 text-xs border-t dark:border-slate-700 pt-3" onSubmit={async e => {
              e.preventDefault();
              const f = e.target;
              const status = f.sts.value;
              const amt = Number(f.amt.value) || 0;
              await patch(m.id, {
                paymentPlan: f.pl.value,
                paymentStatus: status,
                paymentAmount: amt,
                paymentExpiry: f.ex.value || null,
                paymentNotes: f.nt.value.trim(),
                liveAzanAllowed: status !== 'expired',
                timeEditAllowed: status !== 'expired'
              });
              if (status === 'paid' && amt) await logPay(m, f.pl.value, amt, 'Manual Override');
              say('Plan saved');
              setPlanM(null);
            }}>
              <div className="font-bold text-slate-500 uppercase text-[10px]">Manual Expiry & Status Override</div>
              <div className="grid grid-cols-2 gap-2">
                <label className="font-bold">Plan Type
                  <select name="pl" className={inp} defaultValue={m.paymentPlan || 'free'}>
                    <option value="free">Free</option>
                    <option value="monthly">Monthly</option>
                    <option value="yearly">Yearly</option>
                    <option value="lifetime">Lifetime</option>
                  </select>
                </label>
                <label className="font-bold">Status
                  <select name="sts" className={inp} defaultValue={m.paymentStatus || 'free'}>
                    <option value="free">Free</option>
                    <option value="paid">Paid</option>
                    <option value="pending">Pending</option>
                    <option value="expired">Expired (Locked)</option>
                  </select>
                </label>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <label className="font-bold">Amount Paid (₹)<input name="amt" type="number" className={inp} defaultValue={m.paymentAmount || 0} /></label>
                <label className="font-bold">Valid Till Expiry Date<input name="ex" type="date" className={inp} defaultValue={m.paymentExpiry || ''} /></label>
              </div>
              <label className="font-bold block">Payment Note<input name="nt" className={inp} defaultValue={m.paymentNotes || ''} placeholder="e.g. Paid via Cash / UTR / Discounted" /></label>
              <div className="flex gap-2 pt-1">
                <button type="button" onClick={() => setPlanM(null)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
                <button type="submit" className={`${B} text-white flex-[2] py-3 shadow-md`} style={{ background: S.accent }}>Save Plan</button>
              </div>
            </form>
          </Modal>
        );
      })()}

      {/* ============ MODAL: SEASONAL / RAMADAN PRICING CONTROLLER ============ */}
      {bulkPricingModal && (
        <Modal title="⚡ Seasonal / Ramadan Pricing Controller" sub="Ek click me sabhi masjido ke liye annual discount fee set karein" onClose={() => setBulkPricingModal(false)}>
          <div className="space-y-4 text-xs">
            <p className="text-slate-600 dark:text-slate-300">
              Aap Ramadan ya seasonal festive offers ke dauran sabhi masjido ko discount pricing de sakte hain.
            </p>
            <div>
              <div className="font-bold text-slate-700 dark:text-slate-300 mb-1.5">Preset Offers:</div>
              <div className="grid grid-cols-4 gap-2">
                {[199, 299, 499, 699].map(p => (
                  <button
                    key={p}
                    type="button"
                    onClick={() => {
                      setBulkSeasonalFee(p);
                      setBulkSeasonalNote(`Ramadan Mubarak Special: Annual Access just ₹${p}`);
                    }}
                    className={`p-2.5 rounded-xl border text-center font-black transition ${bulkSeasonalFee === p ? 'bg-amber-400 text-slate-900 border-amber-500 shadow-sm' : 'bg-slate-100 dark:bg-slate-700'}`}
                  >
                    ₹{p}/yr
                  </button>
                ))}
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <label className="font-bold block">Yearly Special Fee (₹)
                <input type="number" className={inp} value={bulkSeasonalFee} onChange={e => setBulkSeasonalFee(Number(e.target.value) || 0)} />
              </label>
              <label className="font-bold block">Offer Banner Note
                <input className={inp} value={bulkSeasonalNote} onChange={e => setBulkSeasonalNote(e.target.value)} />
              </label>
            </div>

            <div className="p-3 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 rounded-xl text-amber-900 dark:text-amber-200">
              💡 Yeh settings turant sabhi imamo ke payment card aur QR code me update ho jayegi.
            </div>

            <div className="flex gap-2 pt-2">
              <button type="button" onClick={() => setBulkPricingModal(false)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
              <button
                type="button"
                onClick={async () => {
                  const updatedSettings = {
                    ...S,
                    yearlyFee: bulkSeasonalFee,
                    promoNote: bulkSeasonalNote,
                    updatedAt: Date.now()
                  };
                  setS(updatedSettings);
                  if (db) await db.collection('config').doc('admin_settings').set(updatedSettings, { merge: true });
                  try {
                    if (mq && mq.connected) mq.publish(`${TOPIC}/db/admin_settings`, JSON.stringify(updatedSettings), { retain: true, qos: 1 });
                  } catch(e) {}
                  setBulkPricingModal(false);
                  say(`Pricing updated to ₹${bulkSeasonalFee}/yr with banner!`);
                }}
                className={`${B} text-white flex-[2] py-3 font-black shadow-md`}
                style={{ background: S.accent }}
              >
                Apply Seasonal Pricing Everywhere
              </button>
            </div>
          </div>
        </Modal>
      )}

      {/* ============ MODAL: DELETE CONFIRMATION ============ */}
      {del && (
        <Modal title="Delete Mosque Permanently?" sub={del.name} onClose={() => setDel(null)}>
          <p className="text-sm mb-4 text-slate-700 dark:text-slate-300">
            Are you sure you want to delete <b>{del.name}</b> (ID: {del.id})? All namaz timetables, live broadcast records, and details will be erased from the cloud database permanently. This cannot be undone.
          </p>
          <div className="flex gap-2">
            <button onClick={() => setDel(null)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
            <button onClick={() => delMasjid(del)} className={`${B} bg-rose-600 text-white flex-1 py-3 font-bold shadow-md`}>Delete Mosque</button>
          </div>
        </Modal>
      )}

      {/* ============ MODAL: GENERAL CONFIRMATION ============ */}
      {confirm && (
        <Modal title={confirm.t} onClose={() => setConfirm(null)}>
          <p className="text-sm mb-4 text-slate-700 dark:text-slate-300 leading-relaxed">{confirm.d}</p>
          <div className="flex gap-2">
            <button onClick={() => setConfirm(null)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
            <button onClick={() => { const g = confirm.go; setConfirm(null); if (g) g(); }} className={`${B} bg-rose-600 text-white flex-1 py-3 font-black shadow-md`}>
              Yes, Confirm Action
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
</script>
</body>
</html>
