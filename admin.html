/* ================= SMART LOCATION NORMALIZERS ================= */
const cleanText = (t) => String(t || '').trim().toLowerCase();
const stripPunct = (t) => cleanText(t).replace(/[^a-z0-9]/g, '');

const normalizeState = (rawState) => {
  if (!rawState) return '';
  const c = cleanText(rawState);
  if (STATE_ALIASES[c]) return STATE_ALIASES[c];
  const p = stripPunct(c);
  for (const [k, v] of Object.entries(STATE_ALIASES)) {
    if (stripPunct(k) === p) return v;
  }
  return rawState.trim();
};

const isMosqueInState = (m, targetState) => {
  if (!targetState || targetState === 'all') return true;
  const normTarget = normalizeState(targetState);
  const targetKey = stripPunct(normTarget);
  if (!targetKey) return true;

  const mStateNorm = normalizeState(m.stateName);
  const mStateKey = stripPunct(mStateNorm);
  if (mStateKey === targetKey || mStateKey.includes(targetKey) || targetKey.includes(mStateKey)) return true;

  const addrKey = stripPunct(m.address);
  const locKey = stripPunct(m.stateLocation);
  if (addrKey.includes(targetKey) || locKey.includes(targetKey)) return true;

  if (targetKey === 'uttarpradesh' && (/\bup\b/i.test(m.stateName || '') || /\bup\b/i.test(m.address || ''))) return true;
  if (targetKey === 'madhyapradesh' && (/\bmp\b/i.test(m.stateName || '') || /\bmp\b/i.test(m.address || ''))) return true;
  return false;
};

const isMosqueInDistrict = (m, targetDistrict) => {
  if (!targetDistrict || targetDistrict === 'all') return true;
  const tKey = stripPunct(targetDistrict);
  if (!tKey) return true;
  const locKey = stripPunct(m.stateLocation);
  const addrKey = stripPunct(m.address);
  const nameKey = stripPunct(m.name);
  return locKey.includes(tKey) || addrKey.includes(tKey) || tKey.includes(locKey);
};

/* ================= GENERAL HELPERS ================= */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const addMonths = (s, n) => {
  const d = new Date((s || today()) + 'T00:00:00');
  const day = d.getDate();
  d.setMonth(d.getMonth() + n);
  if (d.getDate() < day) d.setDate(0);
  return iso(d);
};
const daysLeft = s => s ? Math.ceil((new Date(s + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 86400000) : null;
const eff = m => {
  const s = m.paymentStatus || 'free';

};

const compress = (file, max = 400, q = 0.8) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onerror = rej;
  r.onload = e => {
    const im = new Image();
    im.onerror = rej;
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k);
      c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q));
    };
    im.src = e.target.result;
  };
  r.readAsDataURL(file);
});

            if (s.isLive && Date.now() - (s.ts || 0) < 45000) n[s.masjidId] = Date.now();
            else delete n[s.masjidId];
            return n;
          });
        }
      } catch (e) {}
    };
    mq.on('connect', onC);
    mq.on('close', () => setOnline(false));
    mq.on('message', onM);
    if (mq.connected) onC();
    const t = setInterval(() => {
      setLive(p => {
        const n = {};
        Object.keys(p).forEach(k => {
          if (Date.now() - p[k] < 45000) n[k] = p[k];
        });
        return n;
      });
    }, 10000);

      }
    } catch (e) {}
    return updated;
  };

  const batchPatch = async (list, fn) => {

    });

    setMasjids(prev => ({ ...prev, ...updatedMap }));

    if (db) {
      for (let i = 0; i < list.length; i += 400) {
        const batch = db.batch();
        list.slice(i, i + 400).forEach(m => {
          batch.set(db.collection('masjids').doc(m.id), updatedMap[m.id], { merge: true });
        });
        await batch.commit();
      }
    }

    try {
      if (mq && mq.connected) {
        Object.values(updatedMap).forEach(u => {
          mq.publish(`${TOPIC}/db/${u.id}`, JSON.stringify(u), { retain: true, qos: 1 });
        });
        mq.publish(`${TOPIC}/events`, JSON.stringify({ type: 'BATCH_MASJIDS_UPDATED', count: list.length, ts: Date.now() }), { qos: 1 });

      status: 'completed',
      sentAt: now,
      manualSent: manual
    }, { merge: true });

    // Auto-resolve other pending duplicates for this mosque
    const dups = passwordResets.filter(x => x.id !== r.id && (x.masjidId === r.masjidId || x.phone === r.phone));
    dups.forEach(d => {
      db.collection('password_resets').doc(d.id).set({
        status: 'auto_merged',
        resolvedAt: now
      }, { merge: true }).catch(() => {});
    });

    setPasswordResets(prev => prev.map(x => (x.id === r.id ? { ...x, status: 'completed' } : (x.masjidId === r.masjidId || x.phone === r.phone ? { ...x, status: 'auto_merged' } : x))));

  useEffect(() => {

    const oneDayAgo = Date.now() - 24 * 60 * 60 * 1000;
    // Find next pending request that hasn't been sent in the last 24h
    const nextPending = passwordResets.find(r => (!r.status || r.status === 'pending') && (!botSentHistory[r.masjidId || r.phone] || botSentHistory[r.masjidId || r.phone] <= oneDayAgo));

  /* Plan Activation with Automatic Multi-Month Calculation */
  const activateWithAmount = async (m, amountPaid, monthlyRate = 10, note = 'Admin manual activation') => {
    const amt = Number(amountPaid) || 0;
    const rate = Number(monthlyRate) || Number(S.monthlyFee) || 10;
    const calculatedMonths = Math.max(1, Math.floor(amt / rate));
    const base = (m.paymentExpiry && m.paymentExpiry >= today() && eff(m) === 'paid') ? m.paymentExpiry : today();
    const expiry = addMonths(base, calculatedMonths);

    const updateData = {
      paymentPlan: calculatedMonths >= 12 ? 'yearly' : 'monthly',
      paymentStatus: 'paid',
      paymentExpiry: expiry,
      paymentAmount: amt,
      paymentStart: today(),
      liveAzanAllowed: m.liveAzanAllowed !== false,
      timeEditAllowed: m.timeEditAllowed !== false,
      isVerified: !!m.isVerified,
      pendingUtr: null,
      paymentNotes: note
    };

    await patch(m.id, updateData);
    if (amt > 0) {
      await logPay(m, updateData.paymentPlan, amt, `${calculatedMonths} Months @ ₹${rate}/mo - ${note}`);
    }
    say(`${m.name}: ₹${amt} के आधार पर ${calculatedMonths} महीने सक्रिय (वैध: ${expiry})`);

    const cleanDigits = raw.replace(/\D/g, '');
    const isMobile = cleanDigits.length === 10;
    const emailToUse = isMobile ? `admin_${cleanDigits}@masjidconnect.admin` : raw;

    const masterCodes = ['786', 'admin786', S.adminPasscode || '786'];
    if (masterCodes.includes(pass) || masterCodes.includes(raw)) {
      const adminSession = {
        email: isMobile ? `Admin Mobile (${cleanDigits})` : raw,
        uid: 'superadmin_' + (cleanDigits || 'root'),
        displayName: 'Super Admin',
        isMaster: true

      localStorage.setItem('mca_admin_session', JSON.stringify(adminSession));
      setUser(adminSession);
      setLLoading(false);
      say('Welcome, Super Admin! (Master Passcode Verified)');
      return;

    if (auth) {

        localStorage.setItem('mca_admin_session', JSON.stringify({ email: cred.user.email, uid: cred.user.uid }));
        setUser(cred.user);
        setLLoading(false);
        say('Logged in successfully!');
        return;
      } catch (er) {
        if (er.code === 'auth/user-not-found' && pass.length >= 6) {
          try {
            const newCred = await auth.createUserWithEmailAndPassword(emailToUse, pass);
            localStorage.setItem('mca_admin_session', JSON.stringify({ email: newCred.user.email, uid: newCred.user.uid }));
            setUser(newCred.user);
            setLLoading(false);
            say('Admin account created & logged in!');
            return;

        let msg = er.message;
        if (er.code === 'auth/wrong-password' || er.code === 'auth/invalid-credential') {
          msg = 'Galat password ya credentials! (Master Passcode "786" bhi use kar sakte hain)';
        } else if (er.code === 'auth/invalid-email') {
          msg = 'Kripya sahi Email ya 10-digit Mobile number dalein.';
        } else if (er.code === 'auth/user-not-found') {
          msg = 'Account nahi mila. Aap Master Passcode (786) se turant login kar sakte hain.';

        localStorage.setItem('mca_admin_session', JSON.stringify(adminSession));

      m.imamName || '',
      m.phone || '',

      m.timeEditAllowed === false ? 'Locked' : 'Allowed',
      m.lat || '',
      m.lng || '',
      m.followersCount || 0,
      m.info?.maktabHas === 'yes' ? 'Yes' : 'No',

      m.registeredAtISO ? m.registeredAtISO.slice(0, 10) : '',
      m.updatedAt ? new Date(m.updatedAt).toLocaleString('en-GB') : ''
    ].map(csvCell).join(','));

    const url = URL.createObjectURL(new Blob(['\uFEFF' + [H.join(','), ...rows].join('\r\n')], { type: 'text/csv;charset=utf-8;' }));

    a.href = url;
    a.download = `masjids_filtered_${today()}.csv`;

    say(`CSV successfully exported (${listToExport.length} mosques)`);

      ].some(x => String(x || '').toLowerCase().includes(k))) return false;

      if (fState !== 'all' && !isMosqueInState(m, fState)) return false;
      if (fDistrict !== 'all' && !isMosqueInDistrict(m, fDistrict)) return false;

      const s = eff(m);
      if (fStat === 'paid' || fStat === 'free' || fStat === 'expired' || fStat === 'pending') return s === fStat;
      if (fStat === 'suspended') return !!m.isSuspended;
      if (fStat === 'verified') return !!m.isVerified;
      if (fStat === 'live') return !!live[m.id];
      if (fStat === 'azan_blocked') return m.liveAzanAllowed === false;
      if (fStat === 'edit_locked') return m.timeEditAllowed === false;
      if (fStat === 'nogps') return !hasGps(m);

    // Active Paid Revenue drops immediately if a mosque is marked free, expired, or locked
    const activePaidRev = all.filter(m => eff(m) === 'paid').reduce((s, m) => s + (Number(m.paymentAmount) || 0), 0);
    const logRevAll = logs.reduce((s, l) => s + (Number(l.amount) || 0), 0);
    const logRevMo = logs.filter(l => (l.date || '').startsWith(mo)).reduce((s, l) => s + (Number(l.amount) || 0), 0);

    return {
      total: all.length,
      active: c(m => !m.isSuspended),
      susp: c(m => m.isSuspended),
      paid: c(m => eff(m) === 'paid'),
      free: c(m => eff(m) === 'free'),
      exp: c(m => eff(m) === 'expired'),
      ver: c(m => m.isVerified),

            }}>
              <div className="font-bold text-slate-500 uppercase text-[10px]">Payment Plan & Expiry</div>
              <div className="grid grid-cols-2 gap-2">
                <label className="font-bold">Plan Type
                  <select name="pl" className={inp} defaultValue={m.paymentPlan || 'monthly'}>
                    <option value="monthly">Monthly</option>
                    <option value="yearly">Yearly</option>
                    <option value="free">Free</option>
                    <option value="lifetime">Lifetime</option>
                  </select>
                </label>
                <label className="font-bold">Status
                  <select name="sts" className={inp} defaultValue={m.paymentStatus || 'free'}>
                    <option value="paid">Paid</option>
                    <option value="free">Free</option>
                    <option value="pending">Pending</option>
                    <option value="expired">Expired (Locked)</option>
                  </select>
                </label>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <label className="font-bold">Amount Paid (₹)
                  <input name="amt" type="number" className={inp} defaultValue={m.paymentAmount || calcAmt} />
                </label>
                <label className="font-bold">Valid Till Expiry Date
                  <input name="ex" type="date" className={inp} defaultValue={m.paymentExpiry || autoExpiry} />
                </label>
              </div>
              <label className="font-bold block">Payment Note
                <input name="nt" className={inp} defaultValue={m.paymentNotes || ''} placeholder="e.g. Paid via Cash / UTR / ₹30 for 3 Months" />
              </label>

              {/* INDEPENDENT GRANULAR TOGGLES FOR PAID MOSQUE */}
              <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/60 border border-slate-200 dark:border-slate-600 space-y-2">
                <div className="font-extrabold text-slate-700 dark:text-slate-200 uppercase text-[10px] tracking-wide">
                  ⚙️ Individual Feature Controls (Paid होने पर भी कोई सर्विस बंद कर सकते हैं)
                </div>
                <div className="grid grid-cols-2 gap-2 font-bold">
                  <label className="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" name="pLive" defaultChecked={m.liveAzanAllowed !== false} />
                    <span>Live Azan Allowed</span>
                  </label>
                  <label className="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" name="pTime" defaultChecked={m.timeEditAllowed !== false} />
                    <span>Time Edit Allowed</span>
                  </label>
                  <label className="flex items-center gap-1.5 cursor-pointer text-sky-700 dark:text-sky-300">
                    <input type="checkbox" name="pVer" defaultChecked={!!m.isVerified} />
                    <span>🔵 Blue Tick Verified</span>
                  </label>
                  <label className="flex items-center gap-1.5 cursor-pointer text-rose-600 dark:text-rose-400">
                    <input type="checkbox" name="pSusp" defaultChecked={!!m.isSuspended} />
                    <span>🚫 Suspend Account</span>
                  </label>
                </div>
              </div>

              <div className="flex gap-2 pt-1">
                <button type="button" onClick={() => setPlanM(null)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
                <button type="submit" className={`${B} text-white flex-[2] py-3 shadow-md font-bold`} style={{ background: S.accent }}>Save Plan & Permissions</button>
              </div>
            </form>
          </Modal>
        );
      })()}

      {/* ============ MODAL: SEASONAL PRICING ============ */}
      {bulkPricingModal && (
        <Modal title="⚡ Special / Seasonal Pricing Controller" sub="Ek click me sabhi masjido ke liye annual discount fee set karein" onClose={() => setBulkPricingModal(false)}>
          <div className="space-y-4 text-xs">
            <div>
              <div className="font-bold text-slate-700 dark:text-slate-300 mb-1.5">Preset Offers:</div>
              <div className="grid grid-cols-4 gap-2">
                {[49, 99, 199, 299].map(p => (
                  <button
                    key={p}
                    type="button"
                    onClick={() => {
                      setBulkSeasonalFee(p);
                      setBulkSeasonalNote(`Annual Access at just ₹${p}`);
                    }}
                    className={`p-2.5 rounded-xl border text-center font-black transition ${bulkSeasonalFee === p ? 'bg-amber-400 text-slate-900 border-amber-500 shadow-sm' : 'bg-slate-100 dark:bg-slate-700'}`}
                  >
                    ₹{p}/yr
                  </button>
                ))}
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <label className="font-bold block">Yearly Special Fee (₹)
                <input type="number" className={inp} value={bulkSeasonalFee} onChange={e => setBulkSeasonalFee(Number(e.target.value) || 0)} />
              </label>
              <label className="font-bold block">Offer Banner Note
                <input className={inp} value={bulkSeasonalNote} onChange={e => setBulkSeasonalNote(e.target.value)} />
              </label>
            </div>

            <div className="flex gap-2 pt-2">
              <button type="button" onClick={() => setBulkPricingModal(false)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
              <button
                type="button"
                onClick={async () => {
                  const updatedSettings = {
                    ...S,
                    yearlyFee: bulkSeasonalFee,
                    promoNote: bulkSeasonalNote,
                    updatedAt: Date.now()
                  };
                  setS(updatedSettings);
                  if (db) await db.collection('config').doc('admin_settings').set(updatedSettings, { merge: true });
                  try {
                    if (mq && mq.connected) mq.publish(`${TOPIC}/db/admin_settings`, JSON.stringify(updatedSettings), { retain: true, qos: 1 });
                  } catch(e) {}
                  setBulkPricingModal(false);
                  say(`Pricing updated to ₹${bulkSeasonalFee}/yr!`);
                }}
                className={`${B} text-white flex-[2] py-3 font-black shadow-md`}
                style={{ background: S.accent }}
              >
                Apply Special Pricing Everywhere
              </button>
            </div>
          </div>
        </Modal>
      )}

      {/* ============ MODAL: DELETE CONFIRMATION ============ */}
      {del && (
        <Modal title="Delete Mosque Permanently?" sub={del.name} onClose={() => setDel(null)}>
          <p className="text-sm mb-4 text-slate-700 dark:text-slate-300">
            Are you sure you want to delete <b>{del.name}</b> (ID: {del.id})? All namaz timetables, live broadcast records, and details will be erased from the cloud database permanently. This cannot be undone.
          </p>
          <div className="flex gap-2">
            <button onClick={() => setDel(null)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
            <button onClick={() => delMasjid(del)} className={`${B} bg-rose-600 text-white flex-1 py-3 font-bold shadow-md`}>Delete Mosque</button>
          </div>
        </Modal>
      )}

      {/* ============ MODAL: GENERAL CONFIRMATION ============ */}
      {confirm && (
        <Modal title={confirm.t} onClose={() => setConfirm(null)}>
          <p className="text-sm mb-4 text-slate-700 dark:text-slate-300 leading-relaxed">{confirm.d}</p>
          <div className="flex gap-2">
            <button onClick={() => setConfirm(null)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
            <button onClick={() => { const g = confirm.go; setConfirm(null); if (g) g(); }} className={`${B} bg-rose-600 text-white flex-1 py-3 font-black shadow-md`}>
              Yes, Confirm Action
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
</script>
</body>
</html>
