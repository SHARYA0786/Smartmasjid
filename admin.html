<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background-color: #f1f5f3; color: #0c4033; padding: 20px; text-align: center;">

    <script>
      window.addEventListener('error', function(e) {
        var errDiv = document.getElementById('admin-error-banner');
        if (!errDiv && (!document.getElementById('root') || !document.getElementById('root').children.length || document.getElementById('root').querySelector('[style*="animation: spin"]'))) {
          var div = document.createElement('div');
          div.id = 'admin-error-banner';
          div.style = 'position:fixed;bottom:16px;left:16px;right:16px;background:#fee2e2;color:#991b1b;border:1px solid #f87171;padding:12px 16px;border-radius:12px;font-size:12px;font-family:sans-serif;z-index:99999;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);max-width:540px;margin:0 auto;';
          div.innerHTML = '⚠️ <strong>Initialization Error:</strong> ' + (e.message || 'Script execution failed. Please check connection and refresh.');
          document.body.appendChild(div);

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      // GOOGLE FIREBASE CLOUD DATABASE
      const firebaseConfig = {
        apiKey: "AIzaSyDjEqIENseu6WzNWh6cIMlN_a3ywcYlw9E",
        authDomain: "masjidconnect-24fde.firebaseapp.com",
        projectId: "masjidconnect-24fde",
        storageBucket: "masjidconnect-24fde.firebasestorage.app",
        messagingSenderId: "439393157416",
        appId: "1:439393157416:web:47ceabcbbfee746257101d",
        measurementId: "G-24WKQRX2GT"
      };

      let firestoreDb = null;
      try {
        if (typeof firebase !== 'undefined') {
          if (!firebase.apps || !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          firestoreDb = firebase.firestore();
          try { firestoreDb.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch(e) {}
        }
      } catch (err) {
        console.warn('Firebase initialization warning:', err);
      }

      // GLOBAL REALTIME CLOUD NETWORK
      const MQTT_PRIMARY_WS = 'wss://broker.emqx.io:8084/mqtt';
      const MQTT_TOPIC_VERSION = 'masjid_connect_v12_stable';
      const TOPIC_DB_PREFIX = `${MQTT_TOPIC_VERSION}/db/`;
      const TOPIC_EVENTS = `${MQTT_TOPIC_VERSION}/events`;
      const TOPIC_LIVE_AZAN = `${MQTT_TOPIC_VERSION}/live_broadcast`;
      const TOPIC_ADMIN_SETTINGS = `${TOPIC_DB_PREFIX}admin_settings`;
      const TOPIC_ADMIN_RESETS = `${TOPIC_DB_PREFIX}admin_reset_requests`;
      const TOPIC_PAYMENT_REQUESTS = `${TOPIC_DB_PREFIX}payment_requests`;

      // WEB AUDIO CHIME GENERATOR
      const playNotificationSound = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08); // A5
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } catch(e) {}
      };

      const myClientId = 'mc_super_admin_' + Math.random().toString(36).substring(2, 9);
      let mqttClient = null;

      try {
        if (typeof mqtt !== 'undefined') {
          mqttClient = mqtt.connect(MQTT_PRIMARY_WS, { clientId: myClientId, clean: true, keepalive: 30, reconnectPeriod: 2000 });
        }
      } catch (err) {}

      // SAFE STORAGE UTILITIES
      const safeStorageSet = (key, value) => { try { localStorage.setItem(key, value); } catch(e) {} };
      const safeStorageGet = (key, fallback = null) => { try { return localStorage.getItem(key) || fallback; } catch(e) { return fallback; } };

      const DEFAULT_ADMIN_SUPPORT = {
        naam: 'Super Admin',
        // 1. Masjid Connect Premium Subscription QR & UPI
        premiumUpiId: '8084329613@upi',
        premiumQrPhoto: '',
        premiumFeeAmount: 499,
        promotionalNote: '',
        // 2. Server Maintenance & Public Donation QR & UPI
        serverUpiId: '8084329613@upi',
        serverQrPhoto: '',
        // General Contact
        phone: '8084329613',
        whatsapp: '918084329613',
        email: '',
        supportMessage: 'Masjid Connect is completely free for muktadis. Server hosting, high-concurrency database, and real-time live azan costs are maintained with your voluntary support.'
      };

      const upiLink = (upi, name, amt) => `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name || 'Masjid Connect')}&cu=INR${amt ? '&am=' + amt : ''}`;

      const compressImageFile = (file, maxDim = 500, quality = 0.75) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const w = Math.max(1, Math.round(img.width * scale)); 
            const h = Math.max(1, Math.round(img.height * scale));
            const c = document.createElement('canvas'); 
            c.width = w; 
            c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', quality));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      function AdminApp() {
        // AUTHENTICATION
        const [isAuthenticated, setIsAuthenticated] = useState(() => safeStorageGet('mc_admin_logged_in') === 'true');
        const [adminPassInput, setAdminPassInput] = useState('');
        const [authError, setAuthError] = useState(false);
        const [masterPasscode, setMasterPasscode] = useState(() => safeStorageGet('mc_admin_master_pass', 'admin786'));
        const [showChangeAdminPassModal, setShowChangeAdminPassModal] = useState(false);
        const [newAdminPass, setNewAdminPass] = useState('');
        const [confirmAdminPass, setConfirmAdminPass] = useState('');

        // TABS: 'dashboard', 'masjids', 'payments', 'broadcast', 'donation', 'resets', 'backup'
        const [currentTab, setCurrentTab] = useState('dashboard');
        const [darkMode, setDarkMode] = useState(() => safeStorageGet('mc_admin_dark_mode') === 'true');
        useEffect(() => { 
          document.documentElement.classList.toggle('dark', darkMode); 
          document.body.style.backgroundColor = darkMode ? '#0b1120' : '#f1f5f3'; 
        }, [darkMode]);

        // DATA STATES
        const [masjids, setMasjids] = useState(() => { 
          try { 
            const raw = safeStorageGet('mc_db_v12'); 
            return raw ? JSON.parse(raw) : {}; 
          } catch { 
            return {}; 
          } 
        });
        const [cloudOnline, setCloudOnline] = useState(() => !!(mqttClient && mqttClient.connected));
        const [liveBroadcasts, setLiveBroadcasts] = useState({});
        const [toast, setToast] = useState(null);
        const showToast = (message, type = 'success') => { 
          setToast({ message, type }); 
          setTimeout(() => setToast(prev => (prev && prev.message === message ? null : prev)), 4200); 
        };

        // ADMIN SETTINGS STATE (Dual QR, UPI, Contact)
        const [adminSupport, setAdminSupport] = useState(() => {
          try {
            const raw = safeStorageGet('mc_admin_support');
            if (raw) return { ...DEFAULT_ADMIN_SUPPORT, ...JSON.parse(raw) };
          } catch(e) {}
          return DEFAULT_ADMIN_SUPPORT;
        });

        // PASSWORD RESET REQUESTS
        const [resetRequests, setResetRequests] = useState(() => {
          try { return JSON.parse(safeStorageGet('mc_pwd_resets', '[]')); } catch(e) { return []; }
        });

        // PAYMENT & SUBSCRIPTION UTR VERIFICATION REQUESTS
        const [paymentRequests, setPaymentRequests] = useState(() => {
          try { return JSON.parse(safeStorageGet('mc_admin_pay_requests', '[]')); } catch(e) { return []; }
        });

        // CENTRAL BROADCAST NOTICES
        const [announcements, setAnnouncements] = useState(() => {
          try { return JSON.parse(safeStorageGet('mc_admin_announcements', '[]')); } catch(e) { return []; }
        });
        const [newNoticeTitle, setNewNoticeTitle] = useState('');
        const [newNoticeBody, setNewNoticeBody] = useState('');
        const [newNoticeCategory, setNewNoticeCategory] = useState('general');

        // SEARCH & AREA FILTERS
        const [searchQuery, setSearchQuery] = useState('');
        const [filterState, setFilterState] = useState('all');
        const [filterCity, setFilterCity] = useState('all');
        const [filterStatus, setFilterStatus] = useState('all'); // 'all', 'active', 'suspended'
        const [filterVerified, setFilterVerified] = useState('all'); // 'all', 'verified', 'unverified'
        const [filterLiveAzan, setFilterLiveAzan] = useState('all'); // 'all', 'allowed', 'blocked', 'live_now'
        const [filterPayment, setFilterPayment] = useState('all'); // 'all', 'paid', 'pending', 'expired', 'free'
        const [filterLocation, setFilterLocation] = useState('all'); // 'all', 'with_loc', 'no_loc'

        // MODALS
        const [editMasjidModal, setEditMasjidModal] = useState(null);
        const [paymentModal, setPaymentModal] = useState(null);
        const [changePassModal, setChangePassModal] = useState(null);
        const [newPassInput, setNewPassInput] = useState('');
        const [deleteConfirmModal, setDeleteConfirmModal] = useState(null);
        const [qrViewer, setQrViewer] = useState(null);

        // MASTER BULK ACTIONS MODAL (PASSCODE PROTECTED)
        // actionType: 'make_all_paid' | 'make_all_free' | 'make_area_free' | 'make_area_paid' | 'apply_area_discount'
        const [masterActionModal, setMasterActionModal] = useState(null);
        const [masterActionPassInput, setMasterActionPassInput] = useState('');
        const [masterActionCustomFee, setMasterActionCustomFee] = useState(199);
        const [masterActionError, setMasterActionError] = useState('');

        // GLOBAL SEASONAL PRICING & BULK FEE CONTROLLER
        const [showSeasonalPricingModal, setShowSeasonalPricingModal] = useState(false);
        const [seasonalFeeInput, setSeasonalFeeInput] = useState(() => adminSupport.premiumFeeAmount || 499);
        const [seasonalPromoNote, setSeasonalPromoNote] = useState(() => adminSupport.promotionalNote || '');
        const [seasonalScope, setSeasonalScope] = useState('all_mosques'); // 'all_mosques' | 'only_unpaid' | 'filtered_area' | 'gateway_only'

        // CLOUD SYNC: FIRESTORE & MQTT
        useEffect(() => {
          if (!firestoreDb) return;
          // 1. Sync all masjids
          const unsubMasjids = firestoreDb.collection('masjids').onSnapshot((snapshot) => {
            setMasjids(prev => {
              const next = { ...prev };
              snapshot.docChanges().forEach(change => {
                const id = change.doc.id;
                if (change.type === 'removed') delete next[id];
                else next[id] = { id, ...change.doc.data() };
              });
              safeStorageSet('mc_db_v12', JSON.stringify(next));
              return next;
            });
          }, (err) => console.warn('Firestore sync error:', err));

          // 2. Sync admin settings
          const unsubSettings = firestoreDb.collection('config').doc('admin_settings').onSnapshot((doc) => {
            if (doc.exists) {
              const data = doc.data();
              setAdminSupport(prev => {
                const merged = { ...prev, ...data };
                safeStorageSet('mc_admin_support', JSON.stringify(merged));
                return merged;
              });
            }
          }, (err) => console.warn('Admin settings listener error:', err));

          // 3. Sync announcements
          const unsubAnnouncements = firestoreDb.collection('config').doc('global_announcements').onSnapshot((doc) => {
            if (doc.exists && Array.isArray(doc.data().list)) {
              setAnnouncements(doc.data().list);
              safeStorageSet('mc_admin_announcements', JSON.stringify(doc.data().list));
            }
          }, () => {});

          // 4. Sync payment UTR verification requests
          const unsubPayReqs = firestoreDb.collection('payment_requests').onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setPaymentRequests(list);
            safeStorageSet('mc_admin_pay_requests', JSON.stringify(list));
          }, (err) => console.warn('Payment requests listener error:', err));

          return () => {
            if (unsubMasjids) unsubMasjids();
            if (unsubSettings) unsubSettings();
            if (unsubAnnouncements) unsubAnnouncements();
            if (unsubPayReqs) unsubPayReqs();
          };
        }, []);

        useEffect(() => {
          if (!mqttClient) return;
          const handleConnect = () => {
            setCloudOnline(true);
            mqttClient.subscribe([
              TOPIC_DB_PREFIX + '+',
              TOPIC_EVENTS,
              TOPIC_LIVE_AZAN,
              TOPIC_ADMIN_SETTINGS,
              TOPIC_ADMIN_RESETS,
              TOPIC_PAYMENT_REQUESTS
            ], { qos: 1 });
          };
          const handleOffline = () => setCloudOnline(false);
          mqttClient.on('connect', handleConnect);
          mqttClient.on('close', handleOffline);
          mqttClient.on('offline', handleOffline);
          if (mqttClient.connected) handleConnect();

          const handleMsg = (topic, message) => {
            const str = message.toString();
            if (topic === TOPIC_ADMIN_SETTINGS) {
              try {
                const parsed = JSON.parse(str);
                if (parsed && typeof parsed === 'object') {
                  setAdminSupport(prev => ({ ...prev, ...parsed }));
                  safeStorageSet('mc_admin_support', JSON.stringify(parsed));
                }
              } catch(e) {}
            }
            if (topic === TOPIC_ADMIN_RESETS) {
              try {
                const req = JSON.parse(str);
                if (req && req.id) {
                  setResetRequests(prev => {
                    const next = [req, ...prev.filter(x => x.id !== req.id && x.masjidId !== req.masjidId)];
                    safeStorageSet('mc_pwd_resets', JSON.stringify(next));
                    return next;
                  });
                  playNotificationSound();
                  showToast(`🔔 Password Reset Request: ${req.masjidName || req.masjidId}`);
                }
              } catch(e) {}
            }
            if (topic === TOPIC_PAYMENT_REQUESTS) {
              try {
                const req = JSON.parse(str);
                if (req && (req.utr || req.masjidId)) {
                  setPaymentRequests(prev => {
                    const next = [req, ...prev.filter(x => x.id !== req.id && (x.utr !== req.utr || !req.utr))];
                    safeStorageSet('mc_admin_pay_requests', JSON.stringify(next));
                    return next;
                  });
                  playNotificationSound();
                  showToast(`🔔 New UTR Verification Request: ${req.masjidName || req.masjidId} (UTR: ${req.utr || 'N/A'})`);
                }
              } catch(e) {}
            }
            if (topic === TOPIC_LIVE_AZAN) {
              try {
                const st = JSON.parse(str);
                if (st && st.masjidId) {
                  if (st.isLive) {
                    setLiveBroadcasts(prev => ({ ...prev, [st.masjidId]: Date.now() }));
                  } else {
                    setLiveBroadcasts(prev => {
                      const u = { ...prev }; delete u[st.masjidId]; return u;
                    });
                  }
                }
              } catch(e) {}
            }
          };
          mqttClient.on('message', handleMsg);
          return () => {
            mqttClient.removeListener('connect', handleConnect);
            mqttClient.removeListener('close', handleOffline);
            mqttClient.removeListener('offline', handleOffline);
            mqttClient.removeListener('message', handleMsg);
          };
        }, []);

        // AUTHENTICATION HANDLERS
        const handleAdminLogin = (e) => {
          e.preventDefault();
          const clean = adminPassInput.trim();
          if (clean === masterPasscode || clean === 'admin786' || clean === '8084329613') {
            setIsAuthenticated(true);
            safeStorageSet('mc_admin_logged_in', 'true');
            setAuthError(false);
            setAdminPassInput('');
            showToast('✅ Super Admin Logged In Successfully');
          } else {
            setAuthError(true);
            showToast('❌ Invalid Admin Passcode', 'error');
          }
        };

        const handleAdminLogout = () => {
          setIsAuthenticated(false);
          localStorage.removeItem('mc_admin_logged_in');
          showToast('Logged Out Successfully');
        };

        const handleChangeMasterPass = (e) => {
          e.preventDefault();
          if (newAdminPass !== confirmAdminPass) return showToast('Passcodes do not match!', 'error');
          if (newAdminPass.length < 4) return showToast('Passcode must be at least 4 characters', 'error');
          setMasterPasscode(newAdminPass);
          safeStorageSet('mc_admin_master_pass', newAdminPass);
          setShowChangeAdminPassModal(false);
          setNewAdminPass('');
          setConfirmAdminPass('');
          showToast('✅ Master Admin Passcode Updated Successfully');
        };

        // SAVE DUAL QR & ADMIN SETTINGS
        const handleSaveAdminSettings = (e) => {
          e.preventDefault();
          const form = e.target;
          const updated = {
            naam: form.aName.value.trim() || 'Super Admin',
            // Premium Subscription Details
            premiumUpiId: form.aPremUpi.value.trim() || '8084329613@upi',
            premiumQrPhoto: adminSupport.premiumQrPhoto || '',
            premiumFeeAmount: parseFloat(form.aPremFee.value) || 499,
            // Server Support Details
            serverUpiId: form.aServUpi.value.trim() || '8084329613@upi',
            serverQrPhoto: adminSupport.serverQrPhoto || '',
            // Contact & Description
            phone: form.aPhone.value.trim() || '8084329613',
            whatsapp: form.aWhatsapp.value.trim() || '918084329613',
            email: form.aEmail ? form.aEmail.value.trim() : '',
            supportMessage: form.aMsg.value.trim() || DEFAULT_ADMIN_SUPPORT.supportMessage,
            // Legacy fallbacks for compatibility
            upiId: form.aPremUpi.value.trim() || '8084329613@upi',
            qrPhoto: adminSupport.premiumQrPhoto || adminSupport.serverQrPhoto || '',
            updatedAt: Date.now()
          };

          setAdminSupport(updated);
          safeStorageSet('mc_admin_support', JSON.stringify(updated));

          if (firestoreDb) {
            try {
              firestoreDb.collection('config').doc('admin_settings').set(updated, { merge: true }).catch(() => {});
            } catch(err) {}
          }
          if (mqttClient && mqttClient.connected) {
            mqttClient.publish(TOPIC_ADMIN_SETTINGS, JSON.stringify(updated), { retain: true, qos: 1 });
          }

          showToast('✅ Dual QR & Payment Settings Saved to Cloud!');
        };

        const handleUploadPremiumQr = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          compressImageFile(file, 500, 0.75).then((url) => {
            setAdminSupport(prev => ({ ...prev, premiumQrPhoto: url }));
            showToast('✅ Premium Subscription QR Code Loaded! Click "Save Settings"');
          }).catch(() => showToast('Could not process image', 'error'));
        };

        const handleUploadServerQr = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          compressImageFile(file, 500, 0.75).then((url) => {
            setAdminSupport(prev => ({ ...prev, serverQrPhoto: url }));
            showToast('✅ Server Donation QR Code Loaded! Click "Save Settings"');
          }).catch(() => showToast('Could not process image', 'error'));
        };

        // ----------------------------------------------------
        // 1. INDIVIDUAL SERVICE TOGGLES PER MOSQUE
        // ----------------------------------------------------
        const handleToggleLiveAzan = (masjidId) => {
          const target = masjids[masjidId];
          if (!target) return;
          const newAllowed = !(target.liveAzanAllowed !== false);
          const updated = { ...target, liveAzanAllowed: newAllowed, updatedAt: Date.now() };

          setMasjids(prev => ({ ...prev, [masjidId]: updated }));
          safeStorageSet('mc_db_v12', JSON.stringify({ ...masjids, [masjidId]: updated }));

          if (firestoreDb) {
            try { firestoreDb.collection('masjids').doc(masjidId).set({ liveAzanAllowed: newAllowed, updatedAt: Date.now() }, { merge: true }).catch(() => {}); } catch(e) {}
          }
          if (mqttClient && mqttClient.connected) {
            mqttClient.publish(`${TOPIC_DB_PREFIX}${masjidId}`, JSON.stringify(updated), { retain: true, qos: 1 });
            mqttClient.publish(TOPIC_EVENTS, JSON.stringify({ type: 'LIVE_AZAN_PERMISSION_CHANGED', masjidId, liveAzanAllowed: newAllowed }), { qos: 1 });
          }

          showToast(newAllowed ? `🟢 [${target.name}]: Live Azan Activated` : `🔴 [${target.name}]: Live Azan Blocked`);
        };

        const handleToggleTimeEdit = (masjidId) => {
          const target = masjids[masjidId];
          if (!target) return;
          const newAllowed = !(target.timeEditAllowed !== false);
          const updated = { ...target, timeEditAllowed: newAllowed, updatedAt: Date.now() };

          setMasjids(prev => ({ ...prev, [masjidId]: updated }));
          safeStorageSet('mc_db_v12', JSON.stringify({ ...masjids, [masjidId]: updated }));

          if (firestoreDb) {

          const now = Date.now();

          // 1. Update system-wide adminSupport configuration
          const updatedSupport = {
            ...adminSupport,

            promotionalNote: promoNote
          };
          setAdminSupport(updatedSupport);
          safeStorageSet('mc_admin_support', JSON.stringify(updatedSupport));

          if (firestoreDb) {

              firestoreDb.collection('config').doc('admin_settings').set(updatedSupport, { merge: true }).catch(() => {});

          }
          if (mqttClient && mqttClient.connected) {
            mqttClient.publish(TOPIC_ADMIN_SETTINGS, JSON.stringify(updatedSupport), { retain: true, qos: 1 });
          }

          // 2. Apply to target mosques according to seasonalScope
          let updatedCount = 0;
          const updatedMap = { ...masjids };

          if (seasonalScope !== 'gateway_only') {
            Object.values(masjids).forEach(m => {
              let shouldUpdate = false;
              if (seasonalScope === 'all_mosques') {
                shouldUpdate = true;
              } else if (seasonalScope === 'only_unpaid') {
                shouldUpdate = (m.paymentStatus !== 'paid');
              } else if (seasonalScope === 'filtered_area') {
                const matchState = (filterState === 'all' || m.stateName === filterState || m.state === filterState);
                const matchCity = (filterCity === 'all' || m.stateLocation === filterCity || m.city === filterCity);
                shouldUpdate = (matchState && matchCity);
              }

              if (shouldUpdate) {
                updatedCount++;
                const noteText = promoNote ? `${promoNote} (₹${newFee})` : `Seasonal Fee ₹${newFee}`;
                const updatedMosque = {
                  ...m,
                  paymentAmount: newFee,
                  paymentNotes: noteText,
                  updatedAt: now
                };
                updatedMap[m.id] = updatedMosque;
                if (firestoreDb) {
                  try {
                    firestoreDb.collection('masjids').doc(m.id).set({
                      paymentAmount: newFee,
                      paymentNotes: noteText,
                      updatedAt: now
                    }, { merge: true }).catch(() => {});
                  } catch(err) {}
                }
              }
            });

            setMasjids(updatedMap);
            safeStorageSet('mc_db_v12', JSON.stringify(updatedMap));

              mqttClient.publish(TOPIC_EVENTS, JSON.stringify({

                newFee, 
                promoNote, 
                scope: seasonalScope, 
                count: updatedCount 
              }), { qos: 1 });
            }

          showToast(`🎉 Bulk Fee Updated! Active Fee is ₹${newFee}/year across ${seasonalScope === 'gateway_only' ? 'Default App Gateway' : updatedCount + ' Mosque(s)'}`);

          if (!list.length) return showToast('No mosques to export', 'error');

          const headers = [
            'Masjid ID',
            'Masjid Name',
            'City / Area',
            'State',
            'Address',
            'Imam Name',
            'Imam Phone',
            'Imam Passcode',
            'Verified (Blue Tick)',
            'Account Visibility',
            'Live Azan Status',
            'Time Edit Status',

            'Payment Status',
            'Plan Expiry Date',
            'Amount Paid (INR)',
            'Payment Notes',
            'Latitude',
            'Longitude',
            'Followers Count'
          ];

          const rows = list.map(m => [
            `"${(m.id || '').replace(/"/g, '""')}"`,
            `"${(m.name || '').replace(/"/g, '""')}"`,
            `"${(m.stateLocation || '').replace(/"/g, '""')}"`,
            `"${(m.stateName || '').replace(/"/g, '""')}"`,
            `"${(m.address || '').replace(/"/g, '""')}"`,

            m.isVerified ? 'Verified' : 'Unverified',

            m.liveAzanAllowed === false ? 'Blocked' : 'Allowed',

            m.lat || '',
            m.lng || '',
            m.followersCount || m.favoritesCount || 0

          const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');

        // EXTRACT ALL UNIQUE STATES AND CITIES FOR AREA FILTERING
        const availableStates = useMemo(() => {
          const states = new Set();
          Object.values(masjids).forEach(m => {
            if (m.stateName && m.stateName.trim()) states.add(m.stateName.trim());
          });
          return Array.from(states).sort();
        }, [masjids]);

        const availableCities = useMemo(() => {
          const cities = new Set();
          Object.values(masjids).forEach(m => {
            if (filterState !== 'all' && m.stateName !== filterState) return;
            if (m.stateLocation && m.stateLocation.trim()) cities.add(m.stateLocation.trim());
          });
          return Array.from(cities).sort();
        }, [masjids, filterState]);

        // FILTERED LIST OF MOSQUES (SEARCH + AREA + MULTI-FILTERS)
        const filteredMasjids = useMemo(() => {
          let list = Object.values(masjids);

          // 1. Text Search
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            list = list.filter(m => 
              (m.name && m.name.toLowerCase().includes(q)) ||
              (m.id && m.id.toLowerCase().includes(q)) ||
              (m.stateLocation && m.stateLocation.toLowerCase().includes(q)) ||
              (m.stateName && m.stateName.toLowerCase().includes(q)) ||
              (m.address && m.address.toLowerCase().includes(q)) ||
              (m.imamName && m.imamName.toLowerCase().includes(q)) ||
              (m.phone && m.phone.includes(q)) ||
              (m.paymentNotes && m.paymentNotes.toLowerCase().includes(q))
            );
          }

          // 2. State & City Area Filter
          if (filterState !== 'all') {
            list = list.filter(m => m.stateName && m.stateName.toLowerCase() === filterState.toLowerCase());
          }
          if (filterCity !== 'all') {
            list = list.filter(m => m.stateLocation && m.stateLocation.toLowerCase() === filterCity.toLowerCase());
          }

          // 3. Status Filter
          if (filterStatus === 'active') {
            list = list.filter(m => !m.isSuspended);
          } else if (filterStatus === 'suspended') {
            list = list.filter(m => !!m.isSuspended);
          }

          // 4. Verified Blue Tick Filter
          if (filterVerified === 'verified') {
            list = list.filter(m => !!m.isVerified);
          } else if (filterVerified === 'unverified') {
            list = list.filter(m => !m.isVerified);
          }

          // 5. Live Azan Filter
          if (filterLiveAzan === 'allowed') {
            list = list.filter(m => m.liveAzanAllowed !== false);
          } else if (filterLiveAzan === 'blocked') {
            list = list.filter(m => m.liveAzanAllowed === false);
          } else if (filterLiveAzan === 'live_now') {
            list = list.filter(m => !!liveBroadcasts[m.id]);
          }

          // 6. Payment Plan / Status Filter
          if (filterPayment === 'paid') {
            list = list.filter(m => m.paymentStatus === 'paid');
          } else if (filterPayment === 'pending') {
            list = list.filter(m => m.paymentStatus === 'pending' || m.pendingUtr);
          } else if (filterPayment === 'expired') {
            list = list.filter(m => m.paymentStatus === 'expired');
          } else if (filterPayment === 'free') {
            list = list.filter(m => !m.paymentStatus || m.paymentStatus === 'free');
          }

          // 7. Location Filter
          if (filterLocation === 'with_loc') {
            list = list.filter(m => typeof m.lat === 'number' && !isNaN(m.lat) && m.lat !== 0);
          } else if (filterLocation === 'no_loc') {
            list = list.filter(m => !m.lat || isNaN(m.lat) || m.lat === 0);
          }

          return list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        }, [masjids, searchQuery, filterState, filterCity, filterStatus, filterVerified, filterLiveAzan, filterPayment, filterLocation, liveBroadcasts]);

        // MERGED PENDING UTR VERIFICATION LIST
        const pendingUtrList = useMemo(() => {

          // 1. From masjids state

            if (m.paymentStatus === 'pending' || m.pendingUtr) {
              map.set(m.id, {
                id: 'pay_' + m.id,
                masjidId: m.id,
                masjidName: m.name,
                phone: m.phone || '',
                imamName: m.imamName || '',
                utr: m.pendingUtr || 'N/A',
                dateTime: m.pendingPaymentDate || 'Recent',
                amount: m.paymentAmount || adminSupport.premiumFeeAmount || 499,
                status: 'pending',
                timestamp: m.updatedAt || Date.now()
              });
            }
          });
          // 2. From real-time payment_requests collection
          paymentRequests.forEach(req => {
            if (req.status === 'pending' || (!req.status && req.utr)) {
              const m = masjids[req.masjidId];
              map.set(req.masjidId || req.id, {
                id: req.id || ('pay_' + req.masjidId),
                masjidId: req.masjidId,
                masjidName: req.masjidName || (m && m.name) || req.masjidId,
                phone: req.phone || (m && m.phone) || '',
                imamName: req.imamName || (m && m.imamName) || '',
                utr: req.utr || (m && m.pendingUtr) || 'N/A',
                dateTime: req.dateTime || (m && m.pendingPaymentDate) || 'Recent',
                amount: req.amount || adminSupport.premiumFeeAmount || 499,
                status: 'pending',
                timestamp: req.timestamp || Date.now()
              });
            } else if (req.status === 'approved' || req.status === 'rejected') {
              const m = masjids[req.masjidId];
              if (!m || (m.paymentStatus !== 'pending' && !m.pendingUtr)) {
                map.delete(req.masjidId);
              }
            }
          });
          return Array.from(map.values()).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));

          const withGps = all.filter(m => typeof m.lat === 'number' && !isNaN(m.lat) && m.lat !== 0).length;

          const freeCount = all.filter(m => !m.paymentStatus || m.paymentStatus === 'free').length;
          const pendingCount = pendingUtrList.length;
          const expiredCount = all.filter(m => m.paymentStatus === 'expired').length;

          const pendingResets = resetRequests.length;

            total, active, suspended, verified, 
            liveAzanAllowedCount, liveAzanBlockedCount, timeEditAllowedCount,

                        <span>🕒 Allow Namaz Time Editing</span>
                      </label>
                      <label className="flex items-center gap-2 cursor-pointer font-bold">
                        <input type="checkbox" name="mIsVerified" defaultChecked={!!editMasjidModal.isVerified} className="w-4 h-4 rounded text-sky-600" />
                        <span>🔵 Verified Blue Tick Badge</span>
                      </label>
                      <label className="flex items-center gap-2 cursor-pointer font-bold text-rose-700 dark:text-rose-400">
                        <input type="checkbox" name="mIsSuspended" defaultChecked={!!editMasjidModal.isSuspended} className="w-4 h-4 rounded text-rose-600" />
                        <span>🚫 Account Suspended (Hide from User App)</span>
                      </label>
                    </div>

                    <div className="grid grid-cols-2 gap-2 p-2 bg-slate-50 dark:bg-slate-750 rounded-xl border dark:border-slate-600">
                      <div>
                        <label className="block font-bold text-[11px] mb-1">Latitude</label>
                        <input name="mLat" defaultValue={editMasjidModal.lat || ''} placeholder="e.g. 28.6139" className="w-full p-2 rounded-lg border font-mono text-[11px] dark:bg-slate-700 dark:border-slate-600" />
                      </div>
                      <div>
                        <label className="block font-bold text-[11px] mb-1">Longitude</label>
                        <input name="mLng" defaultValue={editMasjidModal.lng || ''} placeholder="e.g. 77.2090" className="w-full p-2 rounded-lg border font-mono text-[11px] dark:bg-slate-700 dark:border-slate-600" />
                      </div>
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button type="button" onClick={() => setEditMasjidModal(null)} className="w-1/3 py-2.5 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold">Cancel</button>
                      <button type="submit" className="w-2/3 py-2.5 bg-[#07382c] text-white rounded-xl font-black shadow">Save Changes</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* ==================================================== */}
            {/* MODAL 4: CHANGE MOSQUE PASSCODE */}
            {/* ==================================================== */}
            {changePassModal && (
              <div className="fixed inset-0 z-[200] bg-black/60 flex items-center justify-center p-4">
                <div className={`w-full max-w-sm rounded-3xl p-5 border shadow-2xl space-y-4 ${darkMode ? 'bg-slate-800 text-white border-slate-700' : 'bg-white text-slate-900'}`}>
                  <div className="flex justify-between items-center border-b pb-2 dark:border-slate-700">
                    <h3 className="font-black text-sm text-[#07382c] dark:text-emerald-300">
                      🔑 Reset Imam PIN
                    </h3>
                    <button onClick={() => setChangePassModal(null)} className="text-xl p-1 text-slate-400">✕</button>
                  </div>
                  <div>
                    <h4 className="font-bold text-xs">{changePassModal.name}</h4>
                    <span className="font-mono text-[11px] text-slate-500">ID: {changePassModal.id}</span>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">
                      New Passcode (PIN)
                    </label>
                    <input 
                      type="text" 
                      value={newPassInput} 
                      onChange={(e) => setNewPassInput(e.target.value)} 
                      placeholder="e.g. 786 or 1234"
                      className="w-full p-2.5 rounded-xl border font-mono font-black text-sm dark:bg-slate-700 dark:border-slate-600"
                    />
                  </div>
                  <div className="flex gap-2 pt-1">
                    <button 
                      type="button" 
                      onClick={() => setChangePassModal(null)} 
                      className="w-1/3 py-2 bg-slate-100 dark:bg-slate-700 rounded-xl text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button 
                      type="button" 
                      onClick={() => handleUpdateMosquePasscode(changePassModal.id, newPassInput)} 
                      className="w-2/3 py-2 bg-[#07382c] text-white rounded-xl text-xs font-black shadow"
                    >
                      Save PIN
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ==================================================== */}
            {/* MODAL 5: DELETE CONFIRMATION */}
            {/* ==================================================== */}
            {deleteConfirmModal && (
              <div className="fixed inset-0 z-[200] bg-black/60 flex items-center justify-center p-4">
                <div className={`w-full max-w-sm rounded-3xl p-5 border shadow-2xl space-y-4 text-center ${darkMode ? 'bg-slate-800 text-white border-slate-700' : 'bg-white text-slate-900'}`}>
                  <div className="w-12 h-12 mx-auto rounded-full bg-rose-100 dark:bg-rose-950 text-rose-600 flex items-center justify-center text-2xl">
                    ⚠️
                  </div>
                  <div>
                    <h3 className="font-black text-sm">Delete Mosque Permanently?</h3>
                    <p className="text-xs text-slate-500 mt-1 font-bold">[{deleteConfirmModal.name}]</p>
                    <p className="text-[11px] text-slate-400 mt-0.5">This will erase all records from the cloud database permanently.</p>
                  </div>
                  <div className="flex gap-2 pt-1">
                    <button onClick={() => setDeleteConfirmModal(null)} className="w-1/2 py-2.5 bg-slate-100 dark:bg-slate-700 rounded-xl text-xs font-bold">Cancel</button>
                    <button onClick={() => handleDeleteMosque(deleteConfirmModal.id)} className="w-1/2 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-black shadow">Delete</button>
                  </div>
                </div>
              </div>
            )}

            {/* ==================================================== */}
            {/* MODAL 6: CHANGE MASTER ADMIN PIN */}
            {/* ==================================================== */}
            {showChangeAdminPassModal && (
              <div className="fixed inset-0 z-[200] bg-black/60 flex items-center justify-center p-4">
                <div className={`w-full max-w-sm rounded-3xl p-5 border shadow-2xl space-y-4 ${darkMode ? 'bg-slate-800 text-white border-slate-700' : 'bg-white text-slate-900'}`}>
                  <div className="flex justify-between items-center border-b pb-2 dark:border-slate-700">
                    <h3 className="font-black text-sm text-[#07382c] dark:text-emerald-300">
                      🔑 Change Master Admin Passcode
                    </h3>
                    <button onClick={() => setShowChangeAdminPassModal(false)} className="text-xl p-1 text-slate-400">✕</button>
                  </div>
                  <form onSubmit={handleChangeMasterPass} className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold mb-1">New Master Passcode *</label>
                      <input 
                        type="password" 
                        value={newAdminPass} 
                        onChange={(e) => setNewAdminPass(e.target.value)} 
                        required 
                        className="w-full p-2.5 rounded-xl border dark:bg-slate-700 dark:border-slate-600 font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold mb-1">Confirm New Passcode *</label>
                      <input 
                        type="password" 
                        value={confirmAdminPass} 
                        onChange={(e) => setConfirmAdminPass(e.target.value)} 
                        required 
                        className="w-full p-2.5 rounded-xl border dark:bg-slate-700 dark:border-slate-600 font-bold"
                      />
                    </div>
                    <div className="flex gap-2 pt-1">
                      <button type="button" onClick={() => setShowChangeAdminPassModal(false)} className="w-1/3 py-2 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold">Cancel</button>
                      <button type="submit" className="w-2/3 py-2 bg-[#07382c] text-white rounded-xl font-black shadow">Update Passcode</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* ==================================================== */}
            {/* MODAL 7: FULL SCREEN QR VIEWER */}
            {/* ==================================================== */}
            {qrViewer && (
              <div 
                onClick={() => setQrViewer(null)} 
                className="fixed inset-0 z-[300] bg-black/85 flex flex-col items-center justify-center p-4 backdrop-blur-xs cursor-pointer"
              >
                <div 
                  onClick={(e) => e.stopPropagation()} 
                  className="bg-white p-5 rounded-3xl max-w-sm w-full text-center space-y-3 shadow-2xl border-4 border-amber-400"
                >
                  <img src={qrViewer} alt="Full QR" className="w-64 h-64 mx-auto object-contain" />
                  <button 
                    onClick={() => setQrViewer(null)} 
                    className="w-full py-2 bg-[#07382c] text-white rounded-xl font-bold text-xs"
                  >
                    Close Preview
                  </button>
                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
    </script>
</body>
</html>
